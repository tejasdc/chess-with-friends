<!doctype html>
<!--
  Chess-with-friends landing prototype v5 — GRID walk.

  Tejas played v4. His words:
    "The jumping around is fine but I don't think I'd like the
     jumping. What I actually like is the pawns kind of TRACING
     BACK THEIR STEPS — not just bopping around."

  So v5 is a walk on the grid — no bezier arcs, no footstep bob, no
  tilt. Pieces move square-by-square via Manhattan routing, files
  then ranks or ranks then files (per-piece variation), with a
  clean glide per square that eases in and out so each square-
  crossing reads as a step. Same tap-tap play, same inlined
  chess.js, same tray. Two additions Tejas asked for:

    A) SLOWER. Speed dropped again — unhurried.
    B) SIDE-TO-MOVE LABELLED in the caption ("WHITE TO MOVE ·
       RÉTI 1921"), so single-move puzzles don't leave the player
       poking dead pieces.

  Also fixed the two saved FENs that stored the AFTER-mate
  position (Fool's Mate, Scholar's Mate) — the side to move had no
  legal moves, so every tap silently failed. Replaced with the
  one-move-before FEN so the puzzle is actually playable.

  Palette LOCKED to mockup D/E/F: celadon ground, buff + teal-dark
  squares, navy ink + cream chip, teak frame. No red.
-->

<style>
  :root {
    --ground:   #7CA898;
    --paper:    #E8DBBE;
    --walnut:   #5F8A7A;
    --ink:      #2E2A3D;
    --cream:    #EEE3C4;
    --teak:     #8C5A2E;
    --teak-dk:  #5f3d1e;
    --stone-on-ground: rgba(46, 42, 61, 0.55);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body { display: grid; place-items: center; padding: 16px; }

  .frame {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: min(96vw, 96vh, 740px);
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wordmark::before {
    content: "";
    width: 9px; height: 9px;
    background: var(--cream);
    display: inline-block;
    transform: translateY(-1px);
    border: 1px solid var(--ink);
  }

  /* The stage is a square that holds the whole physics world: the
     board (sub-region, teak-framed) sits in the middle, and the
     celadon-ground perimeter is where stragglers walk to rest in the
     captured tray. Pieces are absolutely positioned within .stage and
     can travel anywhere within it. */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }
  .board-frame {
    position: absolute;
    /* Board occupies 82% of the stage, centered. The remaining 9% of
       each side is celadon ground that stragglers walk onto. */
    left: 9%;
    top:  9%;
    width:  82%;
    height: 82%;
    background: var(--teak);
    padding: 2%;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 0 rgba(0,0,0,0.18),
      0 12px 24px -8px rgba(46, 42, 61, 0.32);
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    outline: 1px solid rgba(0,0,0,0.28);
    touch-action: manipulation;
  }
  .sq {
    position: relative;
    display: grid;
    place-items: center;
  }
  .sq.light { background: var(--paper); }
  .sq.dark  { background: var(--walnut); }
  .sq.selected::after {
    content: "";
    position: absolute; inset: 2px;
    border: 1.5px solid var(--ink);
    pointer-events: none;
  }
  .sq.dark.selected::after { border-color: var(--cream); }
  .sq.legal::before {
    content: "";
    position: absolute;
    width: 22%; height: 22%;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.72;
    pointer-events: none;
  }
  .sq.dark.legal::before { background: var(--cream); opacity: 0.80; }
  .sq.legal.capture::before {
    width: 88%; height: 88%;
    background: transparent;
    border: 2.5px solid rgba(46, 42, 61, 0.6);
    border-radius: 50%;
  }
  .sq.dark.legal.capture::before {
    border-color: rgba(238, 227, 196, 0.68);
  }
  .coord {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    pointer-events: none;
    letter-spacing: 0.04em;
  }
  .sq.dark .coord { color: rgba(238, 227, 196, 0.7); }
  .sq.light .coord { color: rgba(46, 42, 61, 0.55); }
  .coord-rank { top: 2px; left: 4px; }
  .coord-file { bottom: 2px; right: 5px; text-transform: lowercase; }

  /* Pieces live above the board AND above the ground. They can
     translate anywhere within .stage. */
  .pieces {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .piece {
    position: absolute;
    top: 0; left: 0;
    display: grid;
    place-items: center;
    font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols2", "Arial Unicode MS", sans-serif;
    line-height: 1;
    user-select: none;
    will-change: transform;
    /* Rotate about a point just below center — pieces tip about their
       base, not their middle. Reads as "toppling", not "spinning". */
    transform-origin: 50% 58%;
  }
  .piece.live { pointer-events: auto; cursor: pointer; }
  .piece.pw {
    color: var(--paper);
    text-shadow:
      -1px -1px 0 var(--ink), 1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink), 1px  1px 0 var(--ink),
      0 2px 4px rgba(46, 42, 61, 0.20);
  }
  .piece.pb {
    color: var(--ink);
    text-shadow:
      -1px -1px 0 var(--cream), 1px -1px 0 var(--cream),
      -1px  1px 0 var(--cream), 1px  1px 0 var(--cream),
      0 2px 4px rgba(46, 42, 61, 0.20);
  }
  .piece.selected {
    filter: drop-shadow(0 0 6px rgba(238, 227, 196, 0.9));
  }
  .piece.stuck {
    filter: drop-shadow(0 0 4px rgba(46, 42, 61, 0.35));
  }

  .credit {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone-on-ground);
    padding: 4px 2px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    width: 100%;
    align-items: center;
    padding-top: 2px;
  }
  .foot-hint {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--stone-on-ground);
    max-width: 65%;
  }
  .skip {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: var(--ink);
    border: 1px solid var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    transition: background-color 120ms ease-out;
  }
  .skip:hover { background: #0f0d1a; }
  .skip:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">chess with friends · grid walk v5</div>
    <div class="stage" id="stage">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="foot">
      <p class="foot-hint">Tap a piece, tap a square. Or hit Skip.</p>
      <button class="skip" id="skip">Skip →</button>
    </div>
    <div class="credit" id="credit">Starting position</div>
  </div>

<script>
'use strict';

// -------------------------------------------------------------------------
// Positions: real, cited chess history. Each is a public-domain fact
// from a published game or study. Credit lines are shown after the
// walk-back settles.
// -------------------------------------------------------------------------
const FILLED = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const FILES = ['a','b','c','d','e','f','g','h'];

// Each position stores the FEN ONE MOVE BEFORE the mate/solution
// where relevant, so the side to move actually has a move to make.
// If a position is stored at the checkmate itself, `game.moves()` is
// empty for every square and the puzzle silently dies.
const POSITIONS = [
  { fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
    credit: 'Starting position' },
  // After 1. f3 e5 2. g4 — black to play Qh4# (or anything else).
  { fen: 'rnbqkbnr/pppp1ppp/8/4p3/6P1/5P2/PPPPP2P/RNBQKBNR b KQkq g3 0 2',
    credit: "Fool's mate — 1836" },
  // After 1. e4 e5 2. Bc4 Nc6 3. Qh5 Nf6 — white to play Qxf7#.
  { fen: 'r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4',
    credit: "Scholar's mate — 1656 pattern" },
  { fen: '4rrk1/pR5p/6p1/8/1n2Q3/8/PP4PP/6K1 w - - 0 1',
    credit: "Anastasia's mate — pattern" },
  { fen: '7K/8/k1P5/7p/8/8/8/8 w - - 0 1',
    credit: 'Réti, 1921 — endgame study' },
];

// -------------------------------------------------------------------------
// DOM handles.
// -------------------------------------------------------------------------
const stage      = document.getElementById('stage');
const board      = document.getElementById('board');
const piecesLayer = document.getElementById('pieces');
const creditEl   = document.getElementById('credit');
const skipBtn    = document.getElementById('skip');

// -------------------------------------------------------------------------
// Layout metrics. All in stage-pixel units. The board is a sub-rect of
// the stage; the tray is the celadon strip along the top edge, where
// captured stragglers walk to rest.
// -------------------------------------------------------------------------
let stageW = 0, stageH = 0;
let boardX = 0, boardY = 0, boardW = 0, boardH = 0;
let sqSize = 0;

function measure() {
  const r = stage.getBoundingClientRect();
  stageW = r.width;
  stageH = r.height;
  // CSS: board-frame at 9% margin, 82% size, 2% inner padding. Recompute
  // in JS so board-square math never drifts from CSS pixel rounding.
  const frameLeft = stageW * 0.09;
  const frameTop  = stageH * 0.09;
  const frameW    = stageW * 0.82;
  const frameH    = stageH * 0.82;
  const framePad  = stageW * 0.02;
  boardX = frameLeft + framePad;
  boardY = frameTop  + framePad;
  boardW = frameW - 2 * framePad;
  boardH = frameH - 2 * framePad;
  sqSize = boardW / 8;
}

// Convert a square name like "e4" to its top-left corner in stage-px
// coordinates. Board is oriented white-at-bottom.
function squareToXY(sq) {
  const f = sq.charCodeAt(0) - 97;
  const r = Number(sq[1]);
  return { x: boardX + f * sqSize, y: boardY + (8 - r) * sqSize };
}
function squareCenter(sq) {
  const { x, y } = squareToXY(sq);
  return { x: x + sqSize / 2, y: y + sqSize / 2 };
}
function xyToSquare(cx, cy) {
  const f = Math.floor((cx - boardX) / sqSize);
  const r = 8 - Math.floor((cy - boardY) / sqSize);
  if (f < 0 || f > 7 || r < 1 || r > 8) return null;
  return FILES[f] + r;
}

// -------------------------------------------------------------------------
// chess.js legality engine. Fall back to a permissive "any different-
// color square" stand-in only if the CDN failed (still ships a working
// prototype offline). We check `window.Chess` at each newGame() call
// rather than at parse time — chess.js is loaded via <script type=
// "module">, which is deferred, so it isn't defined when this inline
// script first runs.
// -------------------------------------------------------------------------
let game = null;   // Chess instance for the live position

function newGame(fen) {
  const ChessCtor = window.Chess;
  if (typeof ChessCtor === 'function') {
    try { return new ChessCtor(fen); } catch (e) { /* fall through */ }
  }
  return makeFallbackGame(fen);
}

// Credit line for the position, prefixed with which side responds to
// taps. Without this, single-move puzzles leave players poking pieces
// of the wrong color and getting silent no-ops — the caption is the
// only cue that says "only these pieces are yours right now".
// The .credit CSS already text-transforms to uppercase.
function formatCredit(pos, g) {
  const side = g.turn() === 'w' ? 'White to move' : 'Black to move';
  return side + ' · ' + pos.credit;
}

// Micro-wobble driven per-frame so it composes with the piece's live
// positioning transform (a pure CSS keyframe would clobber the piece's
// square position). Amplitude and duration are tiny — this is a nudge,
// not a shake.
function wobbleStuck(piece) {
  const el = piece.el;
  el.classList.add('stuck');
  const start = performance.now();
  const DUR = 360;
  const AMP = 4;   // radians × piece not — this is a rotation amp
  const baseTx = piece.x;
  const baseTy = piece.y;
  function tick(now) {
    const t = (now - start) / DUR;
    if (t >= 1) {
      el.style.transform = `translate(${baseTx.toFixed(2)}px, ${baseTy.toFixed(2)}px) rotate(0deg)`;
      el.classList.remove('stuck');
      return;
    }
    // One-and-a-half cycle sine, gently damped so it eases out.
    const angleDeg = Math.sin(t * Math.PI * 1.5) * AMP * (1 - t);
    el.style.transform = `translate(${baseTx.toFixed(2)}px, ${baseTy.toFixed(2)}px) rotate(${angleDeg.toFixed(2)}deg)`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function makeFallbackGame(initialFen) {
  // Minimal shim so the rest of the code doesn't care whether chess.js
  // loaded. Interface: fen(), turn(), get(sq), moves({square,verbose}),
  // move({from,to,promotion}).
  let arr = fenToBoardArray(initialFen);   // [{ file, rank, char }]
  let turn = initialFen.split(' ')[1] || 'w';
  const at = (sq) => arr.find(p => p.file + p.rank === sq);
  return {
    fen: () => initialFen,
    turn: () => turn,
    get: (sq) => {
      const p = at(sq);
      if (!p) return null;
      return { color: p.char === p.char.toUpperCase() ? 'w' : 'b',
               type:  p.char.toLowerCase() };
    },
    moves: ({ square, verbose }) => {
      const p = at(square);
      if (!p) return [];
      const myColor = p.char === p.char.toUpperCase() ? 'w' : 'b';
      const out = [];
      for (let f = 0; f < 8; f++) {
        for (let r = 1; r <= 8; r++) {
          const to = FILES[f] + r;
          if (to === square) continue;
          const there = at(to);
          if (there) {
            const theirColor = there.char === there.char.toUpperCase() ? 'w' : 'b';
            if (theirColor === myColor) continue;
            out.push({ from: square, to, flags: 'c', color: myColor,
                       piece: p.char.toLowerCase(), captured: there.char.toLowerCase() });
          } else {
            out.push({ from: square, to, flags: '', color: myColor,
                       piece: p.char.toLowerCase() });
          }
        }
      }
      return verbose ? out : out.map(m => m.to);
    },
    move: ({ from, to }) => {
      const p = at(from);
      if (!p) return null;
      const cap = at(to);
      if (cap) arr = arr.filter(x => x !== cap);
      const [f, rStr] = [to[0], to[1]];
      p.file = f;
      p.rank = Number(rStr);
      turn = turn === 'w' ? 'b' : 'w';
      return { from, to, color: p.char === p.char.toUpperCase() ? 'w' : 'b',
               piece: p.char.toLowerCase(),
               captured: cap ? cap.char.toLowerCase() : undefined,
               flags: cap ? 'c' : '' };
    },
  };
}

// -------------------------------------------------------------------------
// State.
// -------------------------------------------------------------------------
let posIndex = 0;
let animating = false;
let livePieces = [];    // { el, sq, color, type, char, x, y, rot }
let trayPieces = [];    // stragglers resting in the captured tray
let selected = null;    // currently selected square name

// -------------------------------------------------------------------------
// FEN → array of { file, rank, char }.
// -------------------------------------------------------------------------
function fenToBoardArray(fen) {
  const rows = fen.split(' ')[0].split('/');
  const arr = [];
  for (let r = 0; r < 8; r++) {
    let expanded = '';
    for (const ch of rows[r]) expanded += /\d/.test(ch) ? ' '.repeat(+ch) : ch;
    for (let f = 0; f < 8; f++) {
      const ch = expanded[f];
      if (ch !== ' ') arr.push({ file: FILES[f], rank: 8 - r, char: ch });
    }
  }
  return arr;
}

// -------------------------------------------------------------------------
// Build board squares (one-time).
// -------------------------------------------------------------------------
function buildBoardSquares() {
  board.innerHTML = '';
  for (let r = 8; r >= 1; r--) {
    for (let f = 0; f < 8; f++) {
      const file = FILES[f];
      const dark = (f + r) % 2 === 0;
      const cell = document.createElement('div');
      cell.className = 'sq ' + (dark ? 'dark' : 'light');
      cell.dataset.sq = file + r;
      if (f === 0) {
        const c = document.createElement('span');
        c.className = 'coord coord-rank';
        c.textContent = String(r);
        cell.appendChild(c);
      }
      if (r === 1) {
        const c = document.createElement('span');
        c.className = 'coord coord-file';
        c.textContent = file;
        cell.appendChild(c);
      }
      board.appendChild(cell);
    }
  }
  // Listen on .stage (not .board): pieces sit in a sibling layer, so
  // clicks on pieces would otherwise never reach .board.
  stage.addEventListener('click', onBoardClick);
}

function createPieceEl(char) {
  const el = document.createElement('div');
  const isWhite = char === char.toUpperCase();
  el.className = 'piece ' + (isWhite ? 'pw' : 'pb');
  el.textContent = FILLED[char.toLowerCase()];
  el.style.width  = sqSize + 'px';
  el.style.height = sqSize + 'px';
  el.style.fontSize = Math.round(sqSize * 0.82) + 'px';
  return el;
}

function placeLiveAtSquare(p) {
  const { x, y } = squareToXY(p.sq);
  p.x = x; p.y = y; p.rot = 0;
  p.el.style.transform = `translate(${x}px, ${y}px) rotate(0deg)`;
}

function renderPosition(idx) {
  const pos = POSITIONS[idx];
  game = newGame(pos.fen);
  creditEl.textContent = formatCredit(pos, game);
  piecesLayer.innerHTML = '';
  livePieces = [];
  trayPieces = [];
  const arr = fenToBoardArray(pos.fen);
  for (const item of arr) {
    const el = createPieceEl(item.char);
    el.classList.add('live');
    const p = {
      el,
      sq: item.file + item.rank,
      color: item.char === item.char.toUpperCase() ? 'w' : 'b',
      type: item.char.toLowerCase(),
      char: item.char,
      x: 0, y: 0, rot: 0,
    };
    placeLiveAtSquare(p);
    piecesLayer.appendChild(el);
    livePieces.push(p);
  }
  clearSelection();
}

// -------------------------------------------------------------------------
// Tap-tap interaction. Legality from chess.js (or the fallback shim).
// -------------------------------------------------------------------------
function clearSelection() {
  if (selected) {
    board.querySelector(`[data-sq="${selected}"]`)?.classList.remove('selected');
    for (const el of board.querySelectorAll('.legal, .capture')) {
      el.classList.remove('legal', 'capture');
    }
    const p = livePieces.find(x => x.sq === selected);
    if (p) p.el.classList.remove('selected');
  }
  selected = null;
}

function selectSquare(sq) {
  const moves = game.moves({ square: sq, verbose: true });
  if (!moves.length) {
    // Own-color piece that legitimately has no legal moves (blocked
    // by its own pieces, pinned, etc.). Silent no-op reads as "the
    // tap didn't register" — drive a brief wobble in JS so at least
    // SOMETHING acknowledges the tap and the player learns that piece
    // is stuck. Can't do a pure CSS keyframe here because the piece
    // element carries its own live positioning transform.
    const piece = livePieces.find(p => p.sq === sq);
    if (piece) wobbleStuck(piece);
    clearSelection();
    return false;
  }
  clearSelection();
  selected = sq;
  const cell = board.querySelector(`[data-sq="${sq}"]`);
  cell?.classList.add('selected');
  const piece = livePieces.find(p => p.sq === sq);
  piece?.el.classList.add('selected');
  for (const m of moves) {
    const target = board.querySelector(`[data-sq="${m.to}"]`);
    if (!target) continue;
    target.classList.add('legal');
    if (m.flags && (m.flags.includes('c') || m.flags.includes('e'))) {
      target.classList.add('capture');
    }
  }
  return true;
}

function onBoardClick(e) {
  if (animating) return;
  bumpIdle();
  const r = stage.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  const sq = xyToSquare(cx, cy);
  if (!sq) { clearSelection(); return; }

  if (selected) {
    if (sq === selected) { clearSelection(); return; }
    // Is this a legal target?
    const moves = game.moves({ square: selected, verbose: true });
    const legal = moves.find(m => m.to === sq);
    if (legal) {
      const from = selected;
      const move = game.move({ from, to: sq, promotion: 'q' });
      applyMoveVisually(from, sq, move);
      clearSelection();
      // Small beat so the completed move reads before it all tumbles.
      setTimeout(() => transitionToNext(), 320);
      return;
    }
    // Fall through: maybe we're re-selecting a different piece.
  }

  const p = game.get(sq);
  if (!p || p.color !== game.turn()) { clearSelection(); return; }
  selectSquare(sq);
}

function applyMoveVisually(fromSq, toSq, move) {
  const mover = livePieces.find(p => p.sq === fromSq);
  if (!mover) return;
  // Capture: remove any piece currently on target square.
  const captured = livePieces.find(p => p.sq === toSq && p !== mover);
  if (captured) {
    captured.el.remove();
    livePieces = livePieces.filter(p => p !== captured);
  }
  mover.sq = toSq;
  const { x, y } = squareToXY(toSq);
  mover.x = x; mover.y = y;
  mover.el.style.transition = 'transform 220ms cubic-bezier(0.16, 1, 0.3, 1)';
  mover.el.style.transform = `translate(${x}px, ${y}px) rotate(0deg)`;
  setTimeout(() => { mover.el.style.transition = ''; }, 260);
}

skipBtn.addEventListener('click', () => {
  if (animating) return;
  clearSelection();
  transitionToNext();
});

// -------------------------------------------------------------------------
// WALK TRANSITION — v5 grid walk. Every piece traces a Manhattan path
// from its current square to its next-position square (or to a slot in
// the tray if the next position doesn't need it). No bob, no tilt, no
// bezier arc. The delight is that the pieces "trace back their steps"
// on the grid — file-then-rank or rank-then-file, chosen per piece so
// they don't all corner at the same square. Ease-in-out per segment
// puts a natural pause at each square boundary without needing an
// explicit bounce.
//
// Stagger is by target rank (far rank walks first). Larger per-piece
// jitter than v4 (0–220ms) so the crowd doesn't march in step. Slower
// pace: 360ms per square, capped at 6 segments (some tray walks are
// long).
//
// Stragglers walk to the tray (whites below the board, navies above)
// and rest there visibly — never off-screen. Any tray pieces the next
// position calls for walk back onto the board.
// -------------------------------------------------------------------------
function walkTransition() {
  return new Promise((resolve) => {
    const pos = POSITIONS[posIndex];
    creditEl.textContent = formatCredit(pos, game);
    const arr = fenToBoardArray(pos.fen);

    // Build target list.
    const targets = arr.map(item => ({
      sq: item.file + item.rank,
      color: item.char === item.char.toUpperCase() ? 'w' : 'b',
      type: item.char.toLowerCase(),
      char: item.char,
      end: squareCenter(item.file + item.rank),
      assigned: null,
    }));

    // Assign nearest-of-kind fallen piece to each target (greedy).
    const pool = livePieces.slice();
    for (const t of targets) {
      let bestI = -1, bestD = Infinity;
      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p || p.color !== t.color || p.type !== t.type) continue;
        const pcx = p.x + sqSize / 2, pcy = p.y + sqSize / 2;
        const d = (pcx - t.end.x) ** 2 + (pcy - t.end.y) ** 2;
        if (d < bestD) { bestD = d; bestI = i; }
      }
      if (bestI >= 0) { t.assigned = pool[bestI]; pool[bestI] = null; }
    }

    // Spawn any missing kinds from the nearest stage edge.
    for (const t of targets) {
      if (t.assigned) continue;
      const el = createPieceEl(t.char);
      const spawn = pickEdgeSpawn(t.end);
      el.style.opacity = '0';
      el.style.transform = `translate(${spawn.x - sqSize/2}px, ${spawn.y - sqSize/2}px) rotate(0deg)`;
      piecesLayer.appendChild(el);
      const p = {
        el, sq: t.sq, color: t.color, type: t.type, char: t.char,
        x: spawn.x - sqSize/2, y: spawn.y - sqSize/2, rot: 0,
      };
      livePieces.push(p);
      t.assigned = p;
      t._fadeIn = true;
    }

    // Stragglers: everything left in pool. White pieces rest on the
    // celadon strip BELOW the board (they're the "bottom" side); black
    // pieces rest on the strip ABOVE. Both stay inside the stage and
    // never overlap the wordmark / foot content.
    const stragglers = pool.filter(Boolean);
    const trayGap = sqSize * 0.50;
    const trayYWhite = boardY + boardH + sqSize * 0.50;
    const trayYBlack = boardY - sqSize * 0.55;
    const whiteQueue = stragglers.filter(p => p.color === 'w');
    const blackQueue = stragglers.filter(p => p.color === 'b');

    // v5 GRID WALK. Each piece traces a Manhattan (L-shaped) path
    // from its current center to its destination center, in one-
    // square segments. Half the pieces route file-first, half rank-
    // first — chosen per-piece so a shelf of pieces doesn't corner at
    // the same square. Segment duration is a slow, deliberate glide
    // with ease-in-out at each end, so the crossing of each square
    // reads as a step without a bounce or a bob.
    const SEG_MS = 360;                 // per-square glide, unhurried
    const MAX_SEGS = 6;                 // pace-cap on long tray walks
    const SETTLE_MS = 200;
    const now = performance.now();
    const walks = [];

    function buildWaypoints(startCX, startCY, endCX, endCY, prefer) {
      // Corner where the L bends. On-board pieces sit at square centers
      // so the corner also lands on a square center; tray pieces land
      // slightly off-grid, which is fine — the L still reads.
      const corner = prefer === 'file-first'
        ? { x: endCX,   y: startCY }
        : { x: startCX, y: endCY   };
      const points = [{ x: startCX, y: startCY }];
      pushIntermediate(points, corner);
      pushIntermediate(points, { x: endCX, y: endCY });
      return points;
    }
    // Interpolate square-sized steps between last-point and target, so
    // each waypoint sits on the grid boundary.
    function pushIntermediate(points, target) {
      const last = points[points.length - 1];
      const dx = target.x - last.x, dy = target.y - last.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.5) return;
      const steps = Math.max(1, Math.round(len / sqSize));
      for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        points.push({ x: last.x + dx * t, y: last.y + dy * t });
      }
    }

    function pushWalk(piece, endCX, endCY, isTray, rankHint) {
      const startCX = piece.x + sqSize / 2;
      const startCY = piece.y + sqSize / 2;
      const totalDist = Math.hypot(endCX - startCX, endCY - startCY);
      // Piece is already on its target square — skip the animation
      // (a bob-in-place looked like a bug in v4; a step-in-place would
      // read the same). Most pieces don't change squares between
      // adjacent chess positions, so this branch fires often.
      if (totalDist < sqSize * 0.06) return null;

      // Per-piece Manhattan preference. Slight bias so pieces going
      // primarily rightward tend file-first and vice-versa — that
      // stops all 8 pieces of a rank from cornering at the same
      // square. Pure random for the rest.
      const dxAbs = Math.abs(endCX - startCX);
      const dyAbs = Math.abs(endCY - startCY);
      const bias = dxAbs > dyAbs * 1.4 ? 0.30 : 0.65;
      const prefer = Math.random() < bias ? 'file-first' : 'rank-first';

      const waypoints = buildWaypoints(startCX, startCY, endCX, endCY, prefer);
      let segCount = waypoints.length - 1;
      // Pace-cap: extremely long tray walks would otherwise take too
      // long. Merge extra segments into fewer, longer ones (still
      // grid-shaped visually because the endpoints of the merged
      // segments still land on square boundaries most of the time).
      if (segCount > MAX_SEGS) {
        const stride = Math.ceil(segCount / MAX_SEGS);
        const collapsed = [waypoints[0]];
        for (let i = stride; i < waypoints.length; i += stride) {
          collapsed.push(waypoints[i]);
        }
        if (collapsed[collapsed.length - 1] !== waypoints[waypoints.length - 1]) {
          collapsed.push(waypoints[waypoints.length - 1]);
        }
        waypoints.length = 0;
        waypoints.push(...collapsed);
        segCount = waypoints.length - 1;
      }
      const duration = segCount * SEG_MS;

      // Stagger by target rank so the far rank walks first (near-rank
      // pieces don't get walked over). Larger per-piece jitter so the
      // shelf doesn't march in lockstep.
      const rankDelay = (8 - (rankHint ?? 4)) * 90;
      const jitter = Math.random() * 220;
      const startAt = now + rankDelay + jitter;

      const w = {
        piece,
        waypoints,
        segCount,
        segMs: SEG_MS,
        endCX, endCY,
        startAngle: piece.rot,
        startAt, duration,
        isTray,
        fadeIn: false,
      };
      walks.push(w);
      return w;
    }

    // Register the new live and tray sets FIRST — independent of
    // whether each piece actually needed a walk. Some pieces are
    // already on their target squares (very common in v4: most pieces
    // don't change squares between adjacent chess positions) so their
    // walk is skipped, but they still belong to livePieces.
    const nextLive = [];
    const nextTray = [];
    for (const t of targets) {
      const p = t.assigned;
      const w = pushWalk(p, t.end.x, t.end.y, false, Number(t.sq[1]));
      p.sq = t.sq;
      if (w && t._fadeIn) w.fadeIn = true;
      nextLive.push(p);
    }
    whiteQueue.forEach((p, i) => {
      const endCX = boardX + sqSize * 0.5 + i * trayGap;
      const endCY = trayYWhite;
      pushWalk(p, endCX, endCY, true, 8);
      p.sq = null;
      nextTray.push(p);
    });
    blackQueue.forEach((p, i) => {
      const endCX = boardX + sqSize * 0.5 + i * trayGap;
      const endCY = trayYBlack;
      pushWalk(p, endCX, endCY, true, 8);
      p.sq = null;
      nextTray.push(p);
    });
    livePieces = nextLive;
    trayPieces = nextTray;

    // Ensure no lingering CSS transitions interfere with rAF driving.
    for (const w of walks) w.piece.el.style.transition = 'none';
    // Force reflow before we start.
    void piecesLayer.offsetHeight;

    // Ease-in-out per segment: piece slows near each waypoint and
    // accelerates away from it, so each square-crossing reads as a
    // "step" without any actual bounce or vertical bob.
    function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    // Global end frame — a bit after the latest piece finishes. If no
    // piece needs to walk (rare: identical positions), still play a
    // short beat so the caption update doesn't feel dropped.
    const globalEnd = walks.length
      ? walks.reduce((acc, w) => Math.max(acc, w.startAt + w.duration + SETTLE_MS), now) + 160
      : now + 380;

    function frame(tNow) {
      for (const w of walks) {
        const t = tNow - w.startAt;
        if (t < 0) continue;
        const total = w.duration + SETTLE_MS;
        if (t >= total) {
          const tx = w.endCX - sqSize / 2;
          const ty = w.endCY - sqSize / 2;
          w.piece.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(0deg) scale(1)`;
          w.piece.el.style.opacity = '1';
          w.piece.x = tx; w.piece.y = ty; w.piece.rot = 0;
          continue;
        }

        // Travel: work out which segment we're in, then ease across it.
        let pt;
        if (t < w.duration) {
          const globalFrac = t / w.duration;
          const segFloat = globalFrac * w.segCount;
          const segIdx = Math.min(w.segCount - 1, Math.floor(segFloat));
          const segT = easeInOut(segFloat - segIdx);
          const a = w.waypoints[segIdx];
          const b = w.waypoints[segIdx + 1];
          pt = { x: a.x + (b.x - a.x) * segT, y: a.y + (b.y - a.y) * segT };
        } else {
          pt = w.waypoints[w.waypoints.length - 1];
        }

        // Fade-in for spawned pieces (empty pool fills from stage edge).
        if (w.fadeIn) w.piece.el.style.opacity = String(Math.min(1, t / 260));

        // Arrival settle: a small scale beat after the walk finishes.
        // Deliberately subtler than v4 (4% not 6%) so it reads as
        // "arrival breath" not "bounce".
        let scale = 1;
        if (t >= w.duration) {
          const s = (t - w.duration) / SETTLE_MS;
          scale = 1 - 0.04 * Math.sin(s * Math.PI);
        }

        // Angle stays at 0 unless the piece began mid-transition with
        // a non-zero angle (defensive — v5 pieces are all upright).
        let angleRad = 0;
        if (w.startAngle) {
          const standDur = Math.min(240, w.duration);
          if (t < standDur) angleRad = w.startAngle * (1 - easeOutCubic(t / standDur));
        }

        const tx = pt.x - sqSize / 2;
        const ty = pt.y - sqSize / 2;
        const deg = angleRad * 180 / Math.PI;
        w.piece.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(${deg.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
      }

      if (tNow < globalEnd) requestAnimationFrame(frame);
      else {
        for (const w of walks) w.piece.el.style.transition = '';
        for (const p of livePieces) p.el.classList.add('live');
        for (const p of trayPieces) p.el.classList.remove('live');
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}


// Pick the stage-edge point nearest to a destination — for spawning
// pieces that the fallen pool couldn't supply.
function pickEdgeSpawn(dest) {
  const opts = [
    { x: -sqSize * 0.5, y: dest.y },
    { x: stageW + sqSize * 0.5, y: dest.y },
    { x: dest.x, y: -sqSize * 0.5 },
    { x: dest.x, y: stageH + sqSize * 0.5 },
  ];
  let best = 0, bestD = Infinity;
  for (let i = 0; i < opts.length; i++) {
    const d = Math.hypot(opts[i].x - dest.x, opts[i].y - dest.y);
    if (d < bestD) { bestD = d; best = i; }
  }
  return opts[best];
}

// -------------------------------------------------------------------------
// Orchestrator: live → walk → live. That's it. No tumble.
// -------------------------------------------------------------------------
async function transitionToNext() {
  if (animating) return;
  animating = true;
  skipBtn.disabled = true;
  clearSelection();

  // Tray pieces from the previous cycle are eligible to walk back onto
  // the board if the next position calls for them. Merge them into
  // livePieces so the walk-transition pool sees them.
  if (trayPieces.length) {
    for (const p of trayPieces) livePieces.push(p);
    trayPieces = [];
  }

  // Live pieces can't be tapped mid-transition.
  for (const p of livePieces) p.el.classList.remove('live');

  posIndex = (posIndex + 1) % POSITIONS.length;
  game = newGame(POSITIONS[posIndex].fen);
  await walkTransition();

  animating = false;
  skipBtn.disabled = false;
  bumpIdle();
}

// -------------------------------------------------------------------------
// Idle auto-advance.
// -------------------------------------------------------------------------
let idleTimer = null;
const IDLE_MS = 25_000;
function bumpIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!animating) transitionToNext();
  }, IDLE_MS);
}

// -------------------------------------------------------------------------
// Boot + resize handling.
// -------------------------------------------------------------------------
function boot() {
  measure();
  buildBoardSquares();
  renderPosition(0);
  bumpIdle();
}
window.addEventListener('resize', () => {
  measure();
  for (const p of [...livePieces, ...trayPieces]) {
    p.el.style.width  = sqSize + 'px';
    p.el.style.height = sqSize + 'px';
    p.el.style.fontSize = Math.round(sqSize * 0.82) + 'px';
    if (p.sq) placeLiveAtSquare(p);
  }
});
window.addEventListener('load', boot);
</script>
