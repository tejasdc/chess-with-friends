<!doctype html>
<!--
  Tumble prototype v3 — the delight budget of the landing shelf.

  Rules Tejas made hard (unchanged from v2, tightened in v3):

    1) TAP-TAP MECHANICS. Tap a piece, tap a destination. Zero drag,
       zero wobble while a position is live. chess.js legality (falls
       back to permissive if the CDN can't reach us).

    2) TUMBLE with weight — a shove hits the board, pieces slide out
       and rotate, collide with each other, bounce off the teak wall,
       come to rest as a visible spilled picture. Nothing exits the
       screen. Some pieces come to rest LYING ON THEIR SIDE (rotation
       held at ±90°) so the picture reads as chess pieces spilled, not
       chess pieces scattered.

    3) WALK-BACK — each piece stands up from its fallen angle, then
       WALKS across the board to its next-position square. Not a CSS
       tween. Each piece has a per-frame gait: gentle vertical bob at
       walking cadence, a curved (slightly arced) path, a rotation
       tilt that swings with the bob, a micro-pause + small overshoot
       + recover at the arrival square. Pieces the next position
       doesn't need walk OFF THE BOARD to a captured tray beside it,
       and rest there visibly (never off-screen).

  Five real, cited positions with credit lines. Cycles on completed
  move, on Skip, or after ~25s idle. Self-contained; open via file://.

  Palette LOCKED to mockup D/E/F: celadon ground, buff + teal-dark
  squares, navy ink + cream chip, teak frame. No red.
-->

<style>
  :root {
    --ground:   #7CA898;
    --paper:    #E8DBBE;
    --walnut:   #5F8A7A;
    --ink:      #2E2A3D;
    --cream:    #EEE3C4;
    --teak:     #8C5A2E;
    --teak-dk:  #5f3d1e;
    --stone-on-ground: rgba(46, 42, 61, 0.55);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body { display: grid; place-items: center; padding: 16px; }

  .frame {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: min(96vw, 96vh, 740px);
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wordmark::before {
    content: "";
    width: 9px; height: 9px;
    background: var(--cream);
    display: inline-block;
    transform: translateY(-1px);
    border: 1px solid var(--ink);
  }

  /* The stage is a square that holds the whole physics world: the
     board (sub-region, teak-framed) sits in the middle, and the
     celadon-ground perimeter is where stragglers walk to rest in the
     captured tray. Pieces are absolutely positioned within .stage and
     can travel anywhere within it. */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }
  .board-frame {
    position: absolute;
    /* Board occupies 82% of the stage, centered. The remaining 9% of
       each side is celadon ground that stragglers walk onto. */
    left: 9%;
    top:  9%;
    width:  82%;
    height: 82%;
    background: var(--teak);
    padding: 2%;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -2px 0 rgba(0,0,0,0.18),
      0 12px 24px -8px rgba(46, 42, 61, 0.32);
  }
  .board {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    outline: 1px solid rgba(0,0,0,0.28);
    touch-action: manipulation;
  }
  .sq {
    position: relative;
    display: grid;
    place-items: center;
  }
  .sq.light { background: var(--paper); }
  .sq.dark  { background: var(--walnut); }
  .sq.selected::after {
    content: "";
    position: absolute; inset: 2px;
    border: 1.5px solid var(--ink);
    pointer-events: none;
  }
  .sq.dark.selected::after { border-color: var(--cream); }
  .sq.legal::before {
    content: "";
    position: absolute;
    width: 22%; height: 22%;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.72;
    pointer-events: none;
  }
  .sq.dark.legal::before { background: var(--cream); opacity: 0.80; }
  .sq.legal.capture::before {
    width: 88%; height: 88%;
    background: transparent;
    border: 2.5px solid rgba(46, 42, 61, 0.6);
    border-radius: 50%;
  }
  .sq.dark.legal.capture::before {
    border-color: rgba(238, 227, 196, 0.68);
  }
  .coord {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    pointer-events: none;
    letter-spacing: 0.04em;
  }
  .sq.dark .coord { color: rgba(238, 227, 196, 0.7); }
  .sq.light .coord { color: rgba(46, 42, 61, 0.55); }
  .coord-rank { top: 2px; left: 4px; }
  .coord-file { bottom: 2px; right: 5px; text-transform: lowercase; }

  /* Pieces live above the board AND above the ground. They can
     translate anywhere within .stage. */
  .pieces {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .piece {
    position: absolute;
    top: 0; left: 0;
    display: grid;
    place-items: center;
    font-family: "Apple Symbols", "Segoe UI Symbol", "Noto Sans Symbols2", "Arial Unicode MS", sans-serif;
    line-height: 1;
    user-select: none;
    will-change: transform;
    /* Rotate about a point just below center — pieces tip about their
       base, not their middle. Reads as "toppling", not "spinning". */
    transform-origin: 50% 58%;
  }
  .piece.live { pointer-events: auto; cursor: pointer; }
  .piece.pw {
    color: var(--paper);
    text-shadow:
      -1px -1px 0 var(--ink), 1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink), 1px  1px 0 var(--ink),
      0 2px 4px rgba(46, 42, 61, 0.20);
  }
  .piece.pb {
    color: var(--ink);
    text-shadow:
      -1px -1px 0 var(--cream), 1px -1px 0 var(--cream),
      -1px  1px 0 var(--cream), 1px  1px 0 var(--cream),
      0 2px 4px rgba(46, 42, 61, 0.20);
  }
  .piece.selected {
    filter: drop-shadow(0 0 6px rgba(238, 227, 196, 0.9));
  }

  .credit {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone-on-ground);
    padding: 4px 2px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    width: 100%;
    align-items: center;
    padding-top: 2px;
  }
  .foot-hint {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--stone-on-ground);
    max-width: 65%;
  }
  .skip {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: var(--ink);
    border: 1px solid var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    transition: background-color 120ms ease-out;
  }
  .skip:hover { background: #0f0d1a; }
  .skip:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">chess with friends · tumble prototype v3</div>
    <div class="stage" id="stage">
      <div class="board-frame">
        <div class="board" id="board"></div>
      </div>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="foot">
      <p class="foot-hint">Tap a piece, tap a square. Or hit Skip.</p>
      <button class="skip" id="skip">Skip →</button>
    </div>
    <div class="credit" id="credit">Starting position</div>
  </div>

<script>

const POSITIONS = [

    credit: "Fool's mate — 1836" },
  { fen: 'r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 0 4',
    credit: "Scholar's mate — 1656 pattern" },

// -------------------------------------------------------------------------
// DOM handles.
// -------------------------------------------------------------------------
const stage      = document.getElementById('stage');
const board      = document.getElementById('board');
const piecesLayer = document.getElementById('pieces');
const creditEl   = document.getElementById('credit');
const skipBtn    = document.getElementById('skip');

// -------------------------------------------------------------------------
// Layout metrics. All in stage-pixel units. The board is a sub-rect of
// the stage; the tray is the celadon strip along the top edge, where
// captured stragglers walk to rest.
// -------------------------------------------------------------------------
let stageW = 0, stageH = 0;
let boardX = 0, boardY = 0, boardW = 0, boardH = 0;
let sqSize = 0;

function measure() {
  const r = stage.getBoundingClientRect();
  stageW = r.width;
  stageH = r.height;
  // CSS: board-frame at 9% margin, 82% size, 2% inner padding. Recompute
  // in JS so board-square math never drifts from CSS pixel rounding.
  const frameLeft = stageW * 0.09;
  const frameTop  = stageH * 0.09;
  const frameW    = stageW * 0.82;
  const frameH    = stageH * 0.82;
  const framePad  = stageW * 0.02;
  boardX = frameLeft + framePad;
  boardY = frameTop  + framePad;
  boardW = frameW - 2 * framePad;
  boardH = frameH - 2 * framePad;
  sqSize = boardW / 8;
}

// Convert a square name like "e4" to its top-left corner in stage-px
// coordinates. Board is oriented white-at-bottom.
function squareToXY(sq) {
  const f = sq.charCodeAt(0) - 97;
  const r = Number(sq[1]);
  return { x: boardX + f * sqSize, y: boardY + (8 - r) * sqSize };
}
function squareCenter(sq) {
  const { x, y } = squareToXY(sq);
  return { x: x + sqSize / 2, y: y + sqSize / 2 };
}
function xyToSquare(cx, cy) {
  const f = Math.floor((cx - boardX) / sqSize);
  const r = 8 - Math.floor((cy - boardY) / sqSize);
  if (f < 0 || f > 7 || r < 1 || r > 8) return null;
  return FILES[f] + r;
}

// -------------------------------------------------------------------------
// chess.js legality engine. Fall back to a permissive "any different-
// color square" stand-in only if the CDN failed (still ships a working
// prototype offline). We check `window.Chess` at each newGame() call
// rather than at parse time — chess.js is loaded via <script type=
// "module">, which is deferred, so it isn't defined when this inline
// script first runs.
// -------------------------------------------------------------------------
let game = null;   // Chess instance for the live position

function newGame(fen) {
  const ChessCtor = window.Chess;
  if (typeof ChessCtor === 'function') {
    try { return new ChessCtor(fen); } catch (e) { /* fall through */ }
  }
  return makeFallbackGame(fen);
}

function makeFallbackGame(initialFen) {
  // Minimal shim so the rest of the code doesn't care whether chess.js
  // loaded. Interface: fen(), turn(), get(sq), moves({square,verbose}),
  // move({from,to,promotion}).
  let arr = fenToBoardArray(initialFen);   // [{ file, rank, char }]
  let turn = initialFen.split(' ')[1] || 'w';
  const at = (sq) => arr.find(p => p.file + p.rank === sq);
  return {
    fen: () => initialFen,
    turn: () => turn,
    get: (sq) => {
      const p = at(sq);
      if (!p) return null;
      return { color: p.char === p.char.toUpperCase() ? 'w' : 'b',
               type:  p.char.toLowerCase() };
    },
    moves: ({ square, verbose }) => {
      const p = at(square);
      if (!p) return [];
      const myColor = p.char === p.char.toUpperCase() ? 'w' : 'b';
      const out = [];
      for (let f = 0; f < 8; f++) {
        for (let r = 1; r <= 8; r++) {
          const to = FILES[f] + r;
          if (to === square) continue;
          const there = at(to);
          if (there) {
            const theirColor = there.char === there.char.toUpperCase() ? 'w' : 'b';
            if (theirColor === myColor) continue;
            out.push({ from: square, to, flags: 'c', color: myColor,
                       piece: p.char.toLowerCase(), captured: there.char.toLowerCase() });
          } else {
            out.push({ from: square, to, flags: '', color: myColor,
                       piece: p.char.toLowerCase() });
          }
        }
      }
      return verbose ? out : out.map(m => m.to);
    },
    move: ({ from, to }) => {
      const p = at(from);
      if (!p) return null;
      const cap = at(to);
      if (cap) arr = arr.filter(x => x !== cap);
      const [f, rStr] = [to[0], to[1]];
      p.file = f;
      p.rank = Number(rStr);
      turn = turn === 'w' ? 'b' : 'w';
      return { from, to, color: p.char === p.char.toUpperCase() ? 'w' : 'b',
               piece: p.char.toLowerCase(),
               captured: cap ? cap.char.toLowerCase() : undefined,
               flags: cap ? 'c' : '' };
    },
  };
}

// -------------------------------------------------------------------------
// State.
// -------------------------------------------------------------------------
let posIndex = 0;
let animating = false;
let livePieces = [];    // { el, sq, color, type, char, x, y, rot }
let trayPieces = [];    // stragglers resting in the captured tray
let selected = null;    // currently selected square name

// -------------------------------------------------------------------------
// FEN → array of { file, rank, char }.
// -------------------------------------------------------------------------
function fenToBoardArray(fen) {
  const rows = fen.split(' ')[0].split('/');
  const arr = [];
  for (let r = 0; r < 8; r++) {
    let expanded = '';
    for (const ch of rows[r]) expanded += /\d/.test(ch) ? ' '.repeat(+ch) : ch;
    for (let f = 0; f < 8; f++) {
      const ch = expanded[f];
      if (ch !== ' ') arr.push({ file: FILES[f], rank: 8 - r, char: ch });
    }
  }
  return arr;
}

// -------------------------------------------------------------------------
// Build board squares (one-time).
// -------------------------------------------------------------------------
function buildBoardSquares() {
  board.innerHTML = '';
  for (let r = 8; r >= 1; r--) {
    for (let f = 0; f < 8; f++) {
      const file = FILES[f];
      const dark = (f + r) % 2 === 0;
      const cell = document.createElement('div');
      cell.className = 'sq ' + (dark ? 'dark' : 'light');
      cell.dataset.sq = file + r;
      if (f === 0) {
        const c = document.createElement('span');
        c.className = 'coord coord-rank';
        c.textContent = String(r);
        cell.appendChild(c);
      }
      if (r === 1) {
        const c = document.createElement('span');
        c.className = 'coord coord-file';
        c.textContent = file;
        cell.appendChild(c);
      }
      board.appendChild(cell);
    }
  }
  // Listen on .stage (not .board): pieces sit in a sibling layer, so
  // clicks on pieces would otherwise never reach .board.
  stage.addEventListener('click', onBoardClick);
}

function createPieceEl(char) {
  const el = document.createElement('div');
  const isWhite = char === char.toUpperCase();
  el.className = 'piece ' + (isWhite ? 'pw' : 'pb');
  el.textContent = FILLED[char.toLowerCase()];
  el.style.width  = sqSize + 'px';
  el.style.height = sqSize + 'px';
  el.style.fontSize = Math.round(sqSize * 0.82) + 'px';
  return el;
}

function placeLiveAtSquare(p) {
  const { x, y } = squareToXY(p.sq);
  p.x = x; p.y = y; p.rot = 0;
  p.el.style.transform = `translate(${x}px, ${y}px) rotate(0deg)`;
}

function renderPosition(idx) {
  const pos = POSITIONS[idx];
  game = newGame(pos.fen);
  creditEl.textContent = pos.credit;
  piecesLayer.innerHTML = '';
  livePieces = [];
  trayPieces = [];
  const arr = fenToBoardArray(pos.fen);
  for (const item of arr) {
    const el = createPieceEl(item.char);
    el.classList.add('live');
    const p = {
      el,
      sq: item.file + item.rank,
      color: item.char === item.char.toUpperCase() ? 'w' : 'b',
      type: item.char.toLowerCase(),
      char: item.char,
      x: 0, y: 0, rot: 0,
    };
    placeLiveAtSquare(p);
    piecesLayer.appendChild(el);
    livePieces.push(p);
  }
  clearSelection();
}

// -------------------------------------------------------------------------
// Tap-tap interaction. Legality from chess.js (or the fallback shim).
// -------------------------------------------------------------------------
function clearSelection() {
  if (selected) {
    board.querySelector(`[data-sq="${selected}"]`)?.classList.remove('selected');
    for (const el of board.querySelectorAll('.legal, .capture')) {
      el.classList.remove('legal', 'capture');
    }
    const p = livePieces.find(x => x.sq === selected);
    if (p) p.el.classList.remove('selected');
  }
  selected = null;
}

function selectSquare(sq) {
  const moves = game.moves({ square: sq, verbose: true });
  if (!moves.length) { clearSelection(); return false; }
  clearSelection();
  selected = sq;
  const cell = board.querySelector(`[data-sq="${sq}"]`);
  cell?.classList.add('selected');
  const piece = livePieces.find(p => p.sq === sq);
  piece?.el.classList.add('selected');
  for (const m of moves) {
    const target = board.querySelector(`[data-sq="${m.to}"]`);
    if (!target) continue;
    target.classList.add('legal');
    if (m.flags && (m.flags.includes('c') || m.flags.includes('e'))) {
      target.classList.add('capture');
    }
  }
  return true;
}

function onBoardClick(e) {
  if (animating) return;
  bumpIdle();
  const r = stage.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  const sq = xyToSquare(cx, cy);
  if (!sq) { clearSelection(); return; }

  if (selected) {
    if (sq === selected) { clearSelection(); return; }
    // Is this a legal target?
    const moves = game.moves({ square: selected, verbose: true });
    const legal = moves.find(m => m.to === sq);
    if (legal) {
      const from = selected;
      const move = game.move({ from, to: sq, promotion: 'q' });
      applyMoveVisually(from, sq, move);
      clearSelection();
      // Small beat so the completed move reads before it all tumbles.
      setTimeout(() => transitionToNext(), 320);
      return;
    }
    // Fall through: maybe we're re-selecting a different piece.
  }

  const p = game.get(sq);
  if (!p || p.color !== game.turn()) { clearSelection(); return; }
  selectSquare(sq);
}

function applyMoveVisually(fromSq, toSq, move) {
  const mover = livePieces.find(p => p.sq === fromSq);
  if (!mover) return;
  // Capture: remove any piece currently on target square.
  const captured = livePieces.find(p => p.sq === toSq && p !== mover);
  if (captured) {
    captured.el.remove();
    livePieces = livePieces.filter(p => p !== captured);
  }
  mover.sq = toSq;
  const { x, y } = squareToXY(toSq);
  mover.x = x; mover.y = y;
  mover.el.style.transition = 'transform 220ms cubic-bezier(0.16, 1, 0.3, 1)';
  mover.el.style.transform = `translate(${x}px, ${y}px) rotate(0deg)`;
  setTimeout(() => { mover.el.style.transition = ''; }, 260);
}

skipBtn.addEventListener('click', () => {
  if (animating) return;
  clearSelection();
  transitionToNext();
});

// -------------------------------------------------------------------------
// PHYSICS TUMBLE — top-down "spilled marbles" model.
//
// Refinements over v2:
//   • Impulse magnitude scales with distance from the shove origin
//     (near = harder), so corner pieces get real energy — v2 gave
//     h1/a8 too little because it used a constant magnitude.
//   • Very brief ease-in on the impulse (80ms ramp) so the burst reads
//     as "the board just got shoved" rather than "the pieces
//     spontaneously exploded".
//   • At rest, pieces whose angle wound up between 55° and 90° snap
//     to ±90° — they LIE ON THEIR SIDE, held. Reads as weight.
//   • Physics bounds = the full stage (with a small pad). Pieces can
//     travel off the board onto the celadon ground and rest there.
// -------------------------------------------------------------------------
function tumble() {
  return new Promise((resolve) => {
    // Radial impulse from BOARD CENTER — every piece flies outward in
    // its own direction, so pieces spread across all eight ranks
    // instead of piling on one wall. Magnitude scales with distance
    // from center so corner pieces (which were starved by v2's
    // constant magnitude) get enough energy to travel.
    const cx = boardX + boardW / 2;
    const cy = boardY + boardH / 2;

    const state = livePieces.map(p => {
      const pcx = p.x + sqSize / 2;
      const pcy = p.y + sqSize / 2;
      const dx = pcx - cx, dy = pcy - cy;
      const dist = Math.max(sqSize * 0.5, Math.hypot(dx, dy));
      const rnx = dx / dist, rny = dy / dist;
      // Farther from center = more impulse (corner rooks fly harder).
      // Impulse composition. All starting-position pieces begin on
      // the outer ranks (1,2,7,8), so a radial-outward push slams
      // every piece into its nearest wall and leaves the middle
      // empty. Instead we give each piece a mostly-RANDOM direction
      // (uniform angle) plus a small radial-INWARD bias so the
      // empty middle gets populated. Board-edge walls (see PAD)
      // catch pieces that would otherwise leave; wall restitution
      // sends them back into play with some remaining energy.
      const farness = Math.min(1, dist / (boardW * 0.5));
      // With less-aggressive damping (time constant ~200ms), the
      // impulse budget is much smaller: v0 * 200 = travel. We want
      // 1.5–3 squares of travel, so v0 ≈ 0.5–1.1 px/ms.
      // Inward bias: pushes outer pieces toward the empty middle.
      const inwardMag = sqSize * 0.008 * (0.5 + 0.6 * farness);
      // Random direction (uniform angle), varied magnitude.
      const randAngle = Math.random() * Math.PI * 2;
      const randMag = sqSize * (0.010 + Math.random() * 0.008);
      const jx = Math.cos(randAngle) * randMag;
      const jy = Math.sin(randAngle) * randMag;
      // Radial component is NEGATIVE (inward): rnx points away from
      // center, so we subtract to move toward center.
      const mag = -inwardMag;
      return {
        p,
        x: pcx, y: pcy,
        // Target velocity (ramped in via ease-in over first 80ms).
        // Positive rnx*mag = radial OUTWARD; jitter breaks the
        // perfect radial symmetry.
        tvx: rnx * mag + jx,
        tvy: rny * mag + jy,
        vx: 0, vy: 0,
        rot: p.rot,
        vr: (Math.random() - 0.5) * 0.020,  // rad/ms
        // Slightly smaller collision radius than the visual piece so
        // pieces in adjacent squares don't collide at rest and so
        // launching-adjacent pieces don't immediately jam each other.
        r: sqSize * 0.30,
        mass: 1 + (p.type === 'k' || p.type === 'q' ? 0.5 : 0),
      };
    });

    // Physics constants (units: px, ms). Less aggressive damping
    // (time constant ~200ms) so pieces that hit the teak wall have
    // energy left to travel back into the board interior — otherwise
    // everything settles at the walls and the middle stays empty.
    const LINEAR_DAMPING   = 0.9950;
    const ANGULAR_DAMPING  = 0.9910;
    const WALL_RESTITUTION = 0.62;
    const IMPULSE_RAMP_MS = 80;
    const DURATION = 1650;
    const REST_HOLD = 550;

    // Physics bounds = the BOARD interior (the teak frame is the
    // physical wall). Pieces bounce off the frame and stay on the
    // playing surface in visible chaos. Straggler pieces walk out to
    // the captured tray during walk-back; nobody flies off the board
    // during tumble. This mirrors v2's stage-fills-board layout, which
    // spread pieces evenly across the board without corner-pileups.
    const PAD = sqSize * 0.08;
    const minX = boardX + PAD, maxX = boardX + boardW - PAD;
    const minY = boardY + PAD, maxY = boardY + boardH - PAD;

    const start = performance.now();
    let last = start;

    function step(now) {
      const dt = Math.min(32, now - last);
      last = now;
      const t = now - start;

      // Ease-in ramp: 0 → 1 over IMPULSE_RAMP_MS (cubic ease-out feel).
      const rampT = Math.min(1, t / IMPULSE_RAMP_MS);
      const ramp = 1 - Math.pow(1 - rampT, 3);
      for (const s of state) {
        s.vx = s.tvx * ramp;
        s.vy = s.tvy * ramp;
      }
      // Once the ramp completes, we stop overwriting velocity — from
      // this point forward, damping and collisions take over.
      // (After ramp, the assignments above are still needed on the last
      // ramping frame but harmless.)

      const frameDamp = Math.pow(LINEAR_DAMPING, dt);
      const frameAngDamp = Math.pow(ANGULAR_DAMPING, dt);

      // Substep collisions/motion for stability under high initial vel.
      const SUBSTEPS = 3;
      const sdt = dt / SUBSTEPS;

      for (let step = 0; step < SUBSTEPS; step++) {
        for (const s of state) {
          if (t > IMPULSE_RAMP_MS) {
            s.vx *= Math.pow(LINEAR_DAMPING, sdt);
            s.vy *= Math.pow(LINEAR_DAMPING, sdt);
          }
          s.vr *= Math.pow(ANGULAR_DAMPING, sdt);
          s.x  += s.vx * sdt;
          s.y  += s.vy * sdt;
          s.rot += s.vr * sdt;

          // Cap total rotation at ±π so we don't spin arbitrarily.
          if (s.rot >  Math.PI) s.rot -= Math.PI * 2;
          if (s.rot < -Math.PI) s.rot += Math.PI * 2;

          if (s.x - s.r < minX) { s.x = minX + s.r; s.vx = -s.vx * WALL_RESTITUTION; }
          if (s.x + s.r > maxX) { s.x = maxX - s.r; s.vx = -s.vx * WALL_RESTITUTION; }
          if (s.y - s.r < minY) { s.y = minY + s.r; s.vy = -s.vy * WALL_RESTITUTION; }
          if (s.y + s.r > maxY) { s.y = maxY - s.r; s.vy = -s.vy * WALL_RESTITUTION; }

          // Hard rest snap: below threshold, kill motion so nothing
          // jitters at the sub-pixel scale.
          if (Math.abs(s.vx) < baseRest() && Math.abs(s.vy) < baseRest()) {
            s.vx = 0; s.vy = 0;
          }
        }

        // Pairwise circle collisions (32 bodies → ~500 pair checks).
        for (let i = 0; i < state.length; i++) {
          for (let j = i + 1; j < state.length; j++) {
            const a = state[i], b = state[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);
            const minDist = a.r + b.r;
            if (dist < minDist && dist > 0.001) {
              const overlap = (minDist - dist);
              const nx = dx / dist, ny = dy / dist;
              const totalM = a.mass + b.mass;
              a.x -= nx * overlap * (b.mass / totalM);
              a.y -= ny * overlap * (b.mass / totalM);
              b.x += nx * overlap * (a.mass / totalM);
              b.y += ny * overlap * (a.mass / totalM);
              const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
              const vn = rvx * nx + rvy * ny;
              if (vn < 0) {
                const restitution = 0.32;
                const jimp = -(1 + restitution) * vn / (1/a.mass + 1/b.mass);
                a.vx -= jimp * nx / a.mass;
                a.vy -= jimp * ny / a.mass;
                b.vx += jimp * nx / b.mass;
                b.vy += jimp * ny / b.mass;
                // Impact-induced spin.
                const impact = Math.abs(vn);
                const spin = impact * 0.0012;
                a.vr -= spin * (Math.random() - 0.5) * 2;
                b.vr += spin * (Math.random() - 0.5) * 2;
              }
            }
          }
        }
      }

      // Render.
      for (const s of state) {
        const tx = s.x - sqSize / 2;
        const ty = s.y - sqSize / 2;
        const deg = s.rot * 180 / Math.PI;
        s.p.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(${deg.toFixed(2)}deg)`;
        s.p.x = tx; s.p.y = ty; s.p.rot = s.rot;
      }

      if (t < DURATION) requestAnimationFrame(step);
      else {
        // At rest: snap pieces whose rotation ended in the "fallen"
        // zone to exactly ±90°. Reads as "lying on its side, held".
        for (const s of state) {
          const abs = Math.abs(s.rot);
          if (abs > (55 * Math.PI / 180)) {
            const signed = Math.sign(s.rot) * (Math.PI / 2);
            s.rot = signed;
            const tx = s.x - sqSize / 2;
            const ty = s.y - sqSize / 2;
            const deg = s.rot * 180 / Math.PI;
            // Brief settle to the locked angle (200ms) so the snap
            // itself has a beat instead of jumping.
            s.p.el.style.transition = 'transform 200ms cubic-bezier(0.34, 1.5, 0.64, 1)';
            s.p.el.style.transform = `translate(${tx}px, ${ty}px) rotate(${deg.toFixed(2)}deg)`;
            s.p.rot = s.rot;
          }
        }
        // After a hold beat (letting the picture read), resolve.
        setTimeout(() => {
          // Clear any settle-snap transitions so the walk-back can
          // drive transforms every frame without interference.
          for (const s of state) s.p.el.style.transition = '';
          resolve();
        }, REST_HOLD);
      }
    }
    function baseRest() { return sqSize * 0.00035; }
    requestAnimationFrame(step);
  });
}

// -------------------------------------------------------------------------
// WALK-BACK — every piece walks to its next-position square (or to a
// slot in the captured tray, if the next position doesn't need it).
//
// v3 replaces the CSS-tween of v2 with a rAF-driven per-piece animation
// that gives every piece a walk:
//
//   Phase 1 (0 → STAND_MS):   rotate from fallen angle back to 0 with
//                             an ease-out. The piece "stands up".
//   Phase 2 (STAND_MS → END): travel from fallen center to destination
//                             center along a slightly curved bezier
//                             (per-piece perpendicular offset), with:
//                             • vertical bob at footstep cadence
//                               (2.5 steps per second-of-travel),
//                               tapered at both ends of the trip
//                             • rotation tilt swinging with the bob,
//                               tapered at both ends
//   Phase 3 (last SETTLE_MS): scale beats 96% → 100% (arrival settle).
//
// Stagger is by rank: far rank starts first so pieces on nearer ranks
// don't obscure a piece walking behind them. Small per-piece jitter
// keeps the crowd from marching in lockstep.
//
// Stragglers (pieces the next position doesn't need) walk to the
// captured tray, which is the celadon strip above the board (the y
// coordinate is boardY - sqSize * 0.6, cream in one row, navy in
// another). They stay visible on the ground — never off-screen.
// -------------------------------------------------------------------------
function walkBack() {
  return new Promise((resolve) => {
    const pos = POSITIONS[posIndex];
    creditEl.textContent = pos.credit;
    const arr = fenToBoardArray(pos.fen);

    // Build target list.
    const targets = arr.map(item => ({
      sq: item.file + item.rank,
      color: item.char === item.char.toUpperCase() ? 'w' : 'b',
      type: item.char.toLowerCase(),
      char: item.char,
      end: squareCenter(item.file + item.rank),
      assigned: null,
    }));

    // Assign nearest-of-kind fallen piece to each target (greedy).
    const pool = livePieces.slice();
    for (const t of targets) {
      let bestI = -1, bestD = Infinity;
      for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p || p.color !== t.color || p.type !== t.type) continue;
        const pcx = p.x + sqSize / 2, pcy = p.y + sqSize / 2;
        const d = (pcx - t.end.x) ** 2 + (pcy - t.end.y) ** 2;
        if (d < bestD) { bestD = d; bestI = i; }
      }
      if (bestI >= 0) { t.assigned = pool[bestI]; pool[bestI] = null; }
    }

    // Spawn any missing kinds from the nearest stage edge.
    for (const t of targets) {
      if (t.assigned) continue;
      const el = createPieceEl(t.char);
      const spawn = pickEdgeSpawn(t.end);
      el.style.opacity = '0';
      el.style.transform = `translate(${spawn.x - sqSize/2}px, ${spawn.y - sqSize/2}px) rotate(0deg)`;
      piecesLayer.appendChild(el);
      const p = {
        el, sq: t.sq, color: t.color, type: t.type, char: t.char,
        x: spawn.x - sqSize/2, y: spawn.y - sqSize/2, rot: 0,
      };
      livePieces.push(p);
      t.assigned = p;
      t._fadeIn = true;
    }

    // Stragglers: everything left in pool. White pieces rest on the
    // celadon strip BELOW the board (they're the "bottom" side); black
    // pieces rest on the strip ABOVE. Both stay inside the stage and
    // never overlap the wordmark / foot content.
    const stragglers = pool.filter(Boolean);
    const trayGap = sqSize * 0.50;
    const trayYWhite = boardY + boardH + sqSize * 0.50;
    const trayYBlack = boardY - sqSize * 0.55;
    const whiteQueue = stragglers.filter(p => p.color === 'w');
    const blackQueue = stragglers.filter(p => p.color === 'b');

    // Build the walk list. Each entry: piece + startFrame + duration +
    // curve control point + destination + endAngle.
    const now = performance.now();
    const walks = [];
    function pushWalk(piece, endCX, endCY, isTray, rankHint) {
      const startCX = piece.x + sqSize / 2;
      const startCY = piece.y + sqSize / 2;
      const dist = Math.hypot(endCX - startCX, endCY - startCY);
      const speed = boardW * 1.15;   // px per second, walking pace
      const duration = Math.max(700, Math.min(1400, (dist / speed) * 1000));
      // Stagger by rank so the far rank moves first; add larger per-
      // piece jitter (0–180ms) so the crowd doesn't march in lockstep.
      const rankDelay = (8 - (rankHint ?? 4)) * 70;
      const jitter = Math.random() * 180;
      const startAt = now + rankDelay + jitter;

      // Curve: bezier control point offset perpendicular to travel. Per
      // piece deterministic-ish jitter so paths look individual, not
      // parallel. Bias so that pieces coming from the LEFT curve one
      // way and pieces from the RIGHT curve the other — reduces
      // criss-cross visual chaos.
      const dx = endCX - startCX;
      const dy = endCY - startCY;
      const px = -dy, py = dx;
      const perpLen = Math.hypot(px, py) || 1;
      const curveSign = dx < 0 ? -1 : 1;
      const curveAmt = curveSign * dist * (0.06 + Math.random() * 0.10);
      const cx = (startCX + endCX) / 2 + (px / perpLen) * curveAmt;
      const cy = (startCY + endCY) / 2 + (py / perpLen) * curveAmt;

      walks.push({
        piece,
        startCX, startCY, startAngle: piece.rot,
        endCX, endCY, endAngle: 0,
        ctrlX: cx, ctrlY: cy,
        startAt, duration,
        isTray,
        fadeIn: false,
      });
    }

    for (const t of targets) {
      const p = t.assigned;
      pushWalk(p, t.end.x, t.end.y, false, Number(t.sq[1]));
      // Update logical square immediately so subsequent live state is
      // correct once the walk settles.
      p.sq = t.sq;
      if (t._fadeIn) walks[walks.length - 1].fadeIn = true;
    }
    whiteQueue.forEach((p, i) => {
      const endCX = boardX + sqSize * 0.5 + i * trayGap;
      const endCY = trayYWhite;
      pushWalk(p, endCX, endCY, true, 8);
      p.sq = null;
    });
    blackQueue.forEach((p, i) => {
      const endCX = boardX + sqSize * 0.5 + i * trayGap;
      const endCY = trayYBlack;
      pushWalk(p, endCX, endCY, true, 8);
      p.sq = null;
    });

    // Update livePieces / trayPieces registers ahead of the animation
    // so the state is consistent immediately after walk-back completes.
    livePieces = walks.filter(w => !w.isTray).map(w => w.piece);
    trayPieces = walks.filter(w => w.isTray).map(w => w.piece);

    // Ensure no lingering CSS transitions interfere with rAF driving.
    for (const w of walks) w.piece.el.style.transition = 'none';
    // Force reflow before we start.
    void piecesLayer.offsetHeight;

    // Animation constants. Values pushed toward "obvious walking":
    // bob is significant relative to square size (~14%), tilt is a
    // visible ~4°, cadence is ~2 steps per second — slow enough to
    // read as deliberate steps rather than a slide.
    const STAND_MS = 260;
    const SETTLE_MS = 150;
    const BOB_HZ = 2.1;
    const BOB_AMP = sqSize * 0.14;
    const TILT_AMP = 0.070;              // radians (~4°)

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
    function bezier(t, x0, y0, xc, yc, x1, y1) {
      const it = 1 - t;
      return {
        x: it*it*x0 + 2*it*t*xc + t*t*x1,
        y: it*it*y0 + 2*it*t*yc + t*t*y1,
      };
    }

    // Global end frame — a bit after the latest piece finishes.
    const globalEnd = walks.reduce((acc, w) => Math.max(acc, w.startAt + w.duration + STAND_MS + SETTLE_MS), now) + 120;

    function frame(tNow) {
      for (const w of walks) {
        const t = tNow - w.startAt;
        if (t < 0) continue;    // hasn't started yet
        const totalW = STAND_MS + w.duration + SETTLE_MS;
        if (t >= totalW) {
          // Snap to final resting transform.
          const tx = w.endCX - sqSize / 2;
          const ty = w.endCY - sqSize / 2;
          w.piece.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(0deg) scale(1)`;
          w.piece.el.style.opacity = '1';
          w.piece.x = tx; w.piece.y = ty; w.piece.rot = 0;
          continue;
        }

        // Phase 1: stand-up rotation.
        let currentAngle;
        if (t < STAND_MS) {
          const st = t / STAND_MS;
          const e = easeOutCubic(st);
          currentAngle = w.startAngle * (1 - e);
        } else {
          currentAngle = 0;
        }

        // Phase 2: travel with bob + tilt.
        const travelT = Math.max(0, Math.min(1, (t - STAND_MS) / w.duration));
        const travelE = easeInOutCubic(travelT);
        const pt = bezier(travelE, w.startCX, w.startCY, w.ctrlX, w.ctrlY, w.endCX, w.endCY);
        // Bob taper: hats-shape (rise, hold, fall) so bob is strongest
        // in the middle third of the walk, gone at start and end.
        const bobTaper = smoothTaper(travelT, 0.15, 0.85);
        const bobPhase = travelT * (w.duration / 1000) * BOB_HZ * Math.PI * 2;
        const bob = -Math.abs(Math.sin(bobPhase)) * BOB_AMP * bobTaper;
        const tilt = Math.sin(bobPhase * 0.5) * TILT_AMP * bobTaper;

        // Fade-in for spawned pieces.
        if (w.fadeIn) w.piece.el.style.opacity = String(Math.min(1, t / 220));

        // Phase 3: settle. Scale beats 1 → 0.94 → 1 in the last SETTLE_MS.
        let scale = 1;
        const settleStart = STAND_MS + w.duration;
        if (t >= settleStart) {
          const s = (t - settleStart) / SETTLE_MS;
          scale = 1 - 0.06 * Math.sin(s * Math.PI);
        }

        const totalAngle = (currentAngle + tilt);
        const cx = pt.x;
        const cy = pt.y + bob;
        const tx = cx - sqSize / 2;
        const ty = cy - sqSize / 2;
        const deg = totalAngle * 180 / Math.PI;
        w.piece.el.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) rotate(${deg.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
      }

      if (tNow < globalEnd) requestAnimationFrame(frame);
      else {
        // Reset transitions so live moves can use them again.
        for (const w of walks) w.piece.el.style.transition = '';
        // Live pieces get their tap-tap behavior back; tray pieces do
        // not (they're captured).
        for (const p of livePieces) p.el.classList.add('live');
        for (const p of trayPieces) p.el.classList.remove('live');
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

// Bob taper: 0 at both ends of [0,1], 1 in the middle. Uses a smooth
// hat function that ramps up over [0, a], holds 1 over [a, 1-a] tail,
// and ramps down over [1-a, 1].
function smoothTaper(t, a, b) {
  if (t < a) return smoothstep(0, a, t);
  if (t > b) return smoothstep(1, b, t);
  return 1;
}
function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

// Pick the stage-edge point nearest to a destination — for spawning
// pieces that the fallen pool couldn't supply.
function pickEdgeSpawn(dest) {
  const opts = [
    { x: -sqSize * 0.5, y: dest.y },
    { x: stageW + sqSize * 0.5, y: dest.y },
    { x: dest.x, y: -sqSize * 0.5 },
    { x: dest.x, y: stageH + sqSize * 0.5 },
  ];
  let best = 0, bestD = Infinity;
  for (let i = 0; i < opts.length; i++) {
    const d = Math.hypot(opts[i].x - dest.x, opts[i].y - dest.y);
    if (d < bestD) { bestD = d; best = i; }
  }
  return opts[best];
}

// -------------------------------------------------------------------------
// Orchestrator: live → tumble → walk-back → live.
// -------------------------------------------------------------------------
async function transitionToNext() {
  if (animating) return;
  animating = true;
  skipBtn.disabled = true;
  clearSelection();

  // Any tray pieces from the previous cycle fold into the tumble too —
  // they're on the stage, they should tumble along with everything
  // else. Merge them into livePieces so they participate.
  if (trayPieces.length) {
    for (const p of trayPieces) livePieces.push(p);
    trayPieces = [];
  }

  // Live pieces can't be tapped mid-transition.
  for (const p of livePieces) p.el.classList.remove('live');

  await tumble();
  posIndex = (posIndex + 1) % POSITIONS.length;
  game = newGame(POSITIONS[posIndex].fen);
  await walkBack();

  animating = false;
  skipBtn.disabled = false;
  bumpIdle();
}

// -------------------------------------------------------------------------
// Idle auto-advance.
// -------------------------------------------------------------------------
let idleTimer = null;
const IDLE_MS = 25_000;
function bumpIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!animating) transitionToNext();
  }, IDLE_MS);
}

// -------------------------------------------------------------------------
// Boot + resize handling.
// -------------------------------------------------------------------------
function boot() {
  measure();
  buildBoardSquares();
  renderPosition(0);
  bumpIdle();
}
window.addEventListener('resize', () => {
  measure();
  for (const p of [...livePieces, ...trayPieces]) {
    p.el.style.width  = sqSize + 'px';
    p.el.style.height = sqSize + 'px';
    p.el.style.fontSize = Math.round(sqSize * 0.82) + 'px';
    if (p.sq) placeLiveAtSquare(p);
  }
});
window.addEventListener('load', boot);
</script>
