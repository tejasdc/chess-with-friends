<!doctype html>
<!--
  Tumble prototype v2 — the delight budget of the landing shelf.

  Two rules Tejas made hard:
    1) MOVE MECHANICS ARE TAP-TAP. Tap a piece, tap a destination. No
       drag. Identical to the production game screen. While a position
       is live the board behaves like a real board — no wobble, no
       physics, no ambiguity between "is this a move or a toy".
    2) PHYSICS IS THE TRANSITION.
       (a) TOPPLE with weight — pieces get an impulse, gravity pulls
           them down, they slide, rotate, collide with each other and
           with the board's walls/floor, and COME TO REST ON THE BOARD
           in visible chaos. NOTHING DISAPPEARS off-screen.
       (b) WALK BACK — each piece travels visibly across the board
           into its square in the next position. Same pieces where the
           types match (a tumbled white rook walks over to become the
           next position's white rook); any next-position piece with
           no leftover match walks in from the bottom edge; any
           tumbled leftover walks off. Settle with a tiny arrival beat.

  Self-contained; open via file:// from any browser. Cycles through
  five public-domain positions with credit lines.

  Palette LOCKED to the approved mockup D/E/F tokens (celadon ground,
  buff + teal-dark board, navy ink, cream chip). No red.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>tumble — chess with friends landing prototype (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<style>
  :root {
    --ground:   #7CA898;
    --paper:    #E8DBBE;
    --walnut:   #5F8A7A;
    --ink:      #2E2A3D;
    --cream:    #EEE3C4;
    --teak:     #8C5A2E;
    --stone-on-ground: rgba(46, 42, 61, 0.55);
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "IBM Plex Sans", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    min-height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body { display: grid; place-items: center; padding: 16px; }

  .frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: min(92vw, 92vh, 640px);
  }
  .wordmark {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
  }
  .wordmark::before {
    content: "";
    width: 9px; height: 9px;
    background: var(--cream);
    display: inline-block;
    transform: translateY(-1px);
  }
  .stage {
    position: relative;
    width: min(92vw, 92vh, 640px);
    aspect-ratio: 1 / 1;
    box-shadow: 0 0 0 5px var(--teak), 0 8px 22px rgba(46, 42, 61, 0.22);
  }
  .board {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    border: 1px solid var(--ink);
    z-index: 1;
    touch-action: none;
  }
  .sq {
    position: relative;
    display: grid;
    place-items: center;
  }
  .sq.light { background: var(--paper); }
  .sq.dark  { background: var(--walnut); }
  .sq.selected::after {
    content: "";
    position: absolute; inset: 2px;
    border: 1.5px solid var(--ink);
    pointer-events: none;
  }
  .sq.dark.selected::after { border-color: var(--cream); }
  .sq.legal::before {
    content: "";
    position: absolute;
    width: 22%; height: 22%;
    border-radius: 50%;
    background: var(--ink);
    opacity: 0.85;
  }
  .sq.dark.legal::before { background: var(--cream); }
  .coord {
    position: absolute;
    font-family: var(--mono);
    font-size: 9px;
    pointer-events: none;
    letter-spacing: 0.04em;
  }
  .sq.dark .coord { color: rgba(238, 227, 196, 0.7); }
  .sq.light .coord { color: rgba(46, 42, 61, 0.55); }
  .coord-rank { top: 2px; left: 4px; }
  .coord-file { bottom: 2px; right: 5px; text-transform: lowercase; }

  .pieces {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .piece {
    position: absolute;
    top: 0; left: 0;
    display: grid;
    place-items: center;
    font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols2", sans-serif;
    line-height: 1;
    user-select: none;
    will-change: transform;
    transform-origin: 50% 50%;
  }
  .piece.pw {
    color: var(--paper);
    text-shadow:
      -1px -1px 0 var(--ink), 1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink), 1px  1px 0 var(--ink);
  }
  .piece.pb {
    color: var(--ink);
    text-shadow:
      -1px -1px 0 var(--cream), 1px -1px 0 var(--cream),
      -1px  1px 0 var(--cream), 1px  1px 0 var(--cream);
  }
  .piece.selected {
    filter: drop-shadow(0 0 3px var(--cream));
  }

  .credit {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--stone-on-ground);
    align-self: flex-end;
    padding: 4px 2px;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    width: 100%;
    align-items: center;
    padding-top: 4px;
  }
  .foot-hint {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--stone-on-ground);
    max-width: 60%;
  }
  .skip {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--paper);
    background: var(--ink);
    border: 1px solid var(--ink);
    padding: 8px 14px;
    cursor: pointer;
    transition: background-color 120ms ease-out;
  }
  .skip:hover { background: #0f0d1a; }
  .skip:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="frame">
    <div class="wordmark">chess with friends · tumble prototype v2</div>
    <div class="stage" id="stage">
      <div class="board" id="board"></div>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="foot">
      <p class="foot-hint">Tap a piece, tap a square. Or hit Skip.</p>
      <button class="skip" id="skip">Skip →</button>
    </div>
    <div class="credit" id="credit">Starting position</div>
  </div>

<script>
'use strict';

const FILLED = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
const FILES = ['a','b','c','d','e','f','g','h'];

// Five public-domain positions (facts about published games).
const POSITIONS = [
  { fen: 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR', credit: 'Starting position' },
  { fen: 'rnb1kbnr/pppp1ppp/8/4p3/6Pq/5P2/PPPPP2P/RNBQKBNR', credit: "Fool's mate, 1836" },
  { fen: '4rrk1/pR5p/6p1/8/1n2Q3/8/PP4PP/6K1', credit: "Anastasia's mate — pattern" },
  { fen: 'r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR', credit: "Scholar's mate, from 1656" },
  { fen: '7K/8/k1P5/7p/8/8/8/8', credit: 'Réti, 1921 (endgame study)' },
];

const board = document.getElementById('board');
const piecesLayer = document.getElementById('pieces');
const creditEl = document.getElementById('credit');
const skipBtn = document.getElementById('skip');
const stage = document.getElementById('stage');

let posIndex = 0;
let animating = false;
let livePieces = [];   // { el, sq, color, type, char, x, y, rot }
let sqSize = 0;
let selected = null;

function buildBoardSquares() {
  board.innerHTML = '';
  for (let r = 8; r >= 1; r--) {
    for (let f = 0; f < 8; f++) {
      const file = FILES[f];
      const dark = (f + r) % 2 === 0;
      const cell = document.createElement('div');
      cell.className = 'sq ' + (dark ? 'dark' : 'light');
      cell.dataset.sq = file + r;
      if (f === 0) {
        const c = document.createElement('span');
        c.className = 'coord coord-rank';
        c.textContent = String(r);
        cell.appendChild(c);
      }
      if (r === 1) {
        const c = document.createElement('span');
        c.className = 'coord coord-file';
        c.textContent = file;
        cell.appendChild(c);
      }
      board.appendChild(cell);
    }
  }
}

function expandFenRow(row) {
  let out = '';
  for (const ch of row) {
    if (/\d/.test(ch)) out += ' '.repeat(Number(ch));
    else out += ch;
  }
  return out;
}
function fenToBoardArray(fen) {
  const rows = fen.split(' ')[0].split('/');
  const arr = [];
  for (let r = 0; r < 8; r++) {
    const line = expandFenRow(rows[r]);
    for (let f = 0; f < 8; f++) {
      const ch = line[f];
      if (ch === ' ') continue;
      arr.push({ file: FILES[f], rank: 8 - r, char: ch });
    }
  }
  return arr;
}

function squareToXY(sq) {
  const f = sq.charCodeAt(0) - 97;
  const r = Number(sq[1]);
  return { x: f * sqSize, y: (8 - r) * sqSize };
}

function updateSqSize() {
  const rect = stage.getBoundingClientRect();
  sqSize = rect.width / 8;
  for (const p of livePieces) {
    p.el.style.width = sqSize + 'px';
    p.el.style.height = sqSize + 'px';
    p.el.style.fontSize = Math.round(sqSize * 0.74) + 'px';
    const { x, y } = squareToXY(p.sq);
    p.x = x; p.y = y; p.rot = 0;
    p.el.style.transform = `translate(${x}px, ${y}px) rotate(0rad)`;
  }
}
window.addEventListener('resize', updateSqSize);

function createPieceEl(char) {
  const el = document.createElement('div');
  const isWhite = char === char.toUpperCase();
  el.className = 'piece ' + (isWhite ? 'pw' : 'pb');
  el.textContent = FILLED[char.toLowerCase()];
  el.style.width = sqSize + 'px';
  el.style.height = sqSize + 'px';
  el.style.fontSize = Math.round(sqSize * 0.74) + 'px';
  return el;
}

function renderPosition(idx) {
  const pos = POSITIONS[idx];
  creditEl.textContent = pos.credit;
  const arr = fenToBoardArray(pos.fen);
  piecesLayer.innerHTML = '';
  livePieces = [];
  for (const p of arr) {
    const el = createPieceEl(p.char);
    const { x, y } = squareToXY(p.file + p.rank);
    el.style.transform = `translate(${x}px, ${y}px) rotate(0rad)`;
    piecesLayer.appendChild(el);
    livePieces.push({
      el, sq: p.file + p.rank,
      color: p.char === p.char.toUpperCase() ? 'w' : 'b',
      type: p.char.toLowerCase(),
      char: p.char,
      x, y, rot: 0,
    });
  }
}

function pieceAt(sq) {
  return livePieces.find(p => p.sq === sq);
}
function clearSelection() {
  if (selected) {
    board.querySelector(`[data-sq="${selected}"]`)?.classList.remove('selected');
    for (const el of board.querySelectorAll('.legal')) el.classList.remove('legal');
    const p = pieceAt(selected);
    if (p) p.el.classList.remove('selected');
  }
  selected = null;
}
function markLegalMovesFrom(sq) {
  const from = pieceAt(sq);
  if (!from) return;
  for (let r = 1; r <= 8; r++) {
    for (let f = 0; f < 8; f++) {
      const target = FILES[f] + r;
      if (target === sq) continue;
      const there = pieceAt(target);
      if (!there || there.color !== from.color) {
        board.querySelector(`[data-sq="${target}"]`)?.classList.add('legal');
      }
    }
  }
}

// TAP-TAP mechanics (identical to production game screen).
board.addEventListener('click', (e) => {
  if (animating) return;
  const cell = e.target.closest('.sq');
  if (!cell) return;
  const sq = cell.dataset.sq;
  if (!selected) {
    if (!pieceAt(sq)) return;
    selected = sq;
    cell.classList.add('selected');
    pieceAt(sq).el.classList.add('selected');
    markLegalMovesFrom(sq);
    return;
  }
  if (sq === selected) { clearSelection(); return; }
  const there = pieceAt(sq);
  const from = pieceAt(selected);
  if (there && there.color === from.color) {
    clearSelection();
    selected = sq;
    cell.classList.add('selected');
    there.el.classList.add('selected');
    markLegalMovesFrom(sq);
    return;
  }
  const fromPiece = pieceAt(selected);
  if (there) {
    there.el.remove();
    livePieces = livePieces.filter(p => p !== there);
  }
  fromPiece.sq = sq;
  const { x, y } = squareToXY(sq);
  fromPiece.x = x; fromPiece.y = y;
  fromPiece.el.style.transition = 'transform 180ms cubic-bezier(0.16, 1, 0.3, 1)';
  fromPiece.el.style.transform = `translate(${x}px, ${y}px) rotate(0rad)`;
  clearSelection();
  setTimeout(() => {
    fromPiece.el.style.transition = '';
    transitionToNext();
  }, 220);
});

skipBtn.addEventListener('click', () => {
  if (animating) return;
  clearSelection();
  transitionToNext();
});

// ---- Physics tumble — TOP-DOWN spilled-marbles model.
//
// The board is viewed from above, so "gravity" is not the physics that
// makes pieces topple. What we want is a shove — the board gets a jolt,
// pieces slide across the wood, collide with each other and with the
// frame, and drag brings them to rest scattered across all eight ranks
// (NOT piled at one edge like the first attempt).
//
// Impulse composition per piece:
//   outward-radial from board center  — the "explosion" moment
//   large random tangential jitter    — nothing lines up too neatly
//   angular velocity                  — visible tumble on the way out
// Friction is high (0.984 per ms) so motion visibly slows and stops
// within ~1500ms. Bounces on all four walls (they are the teak frame).
function tumble() {
  return new Promise((resolve) => {
    const bounds = { w: sqSize * 8, h: sqSize * 8 };
    const cx = bounds.w / 2, cy = bounds.h / 2;
    const state = livePieces.map(p => {
      const px = p.x + sqSize / 2, py = p.y + sqSize / 2;
      const dx = px - cx, dy = py - cy;
      const dist = Math.max(sqSize * 0.5, Math.sqrt(dx * dx + dy * dy));
      const nx = dx / dist, ny = dy / dist;
      const impulseOut = sqSize * (0.028 + Math.random() * 0.020);
      const jitterMag  = sqSize * 0.022;
      return {
        p, x: px, y: py,
        vx: nx * impulseOut + (Math.random() - 0.5) * jitterMag,
        vy: ny * impulseOut + (Math.random() - 0.5) * jitterMag,
        rot: p.rot,
        vr: (Math.random() - 0.5) * 0.020,
        r: sqSize * 0.34,
      };
    });

    // Per-MS damping. Want energy to visibly decay across ~1500ms of
    // tumble, so a piece that starts fast is still moving when it hits
    // its second neighbour. LINEAR^1500 ≈ 0.03 → LINEAR ≈ 0.9977.
    const LINEAR_DAMPING = 0.9977;
    const ANGULAR_DAMPING = 0.9968;
    const WALL_RESTITUTION = 0.62;
    const REST_SPEED = sqSize * 0.0004;
    const DURATION = 1700;

    const start = performance.now();
    let last = start;

    function step(now) {
      const dt = Math.min(32, now - last);
      last = now;

      // Per-ms friction: use LINEAR_DAMPING^dt so friction scales with
      // frame time rather than jumping every render.
      const frameDamp = Math.pow(LINEAR_DAMPING, dt);
      const frameAngDamp = Math.pow(ANGULAR_DAMPING, dt);
      for (const s of state) {
        s.vx *= frameDamp;
        s.vy *= frameDamp;
        s.vr *= frameAngDamp;
        s.x  += s.vx * dt;
        s.y  += s.vy * dt;
        s.rot += s.vr * dt;

        if (s.x - s.r < 0)          { s.x = s.r;             s.vx = -s.vx * WALL_RESTITUTION; }
        if (s.x + s.r > bounds.w)   { s.x = bounds.w - s.r;  s.vx = -s.vx * WALL_RESTITUTION; }
        if (s.y - s.r < 0)          { s.y = s.r;             s.vy = -s.vy * WALL_RESTITUTION; }
        if (s.y + s.r > bounds.h)   { s.y = bounds.h - s.r;  s.vy = -s.vy * WALL_RESTITUTION; }

        // Hard rest snap once motion falls under threshold — no jitter.
        if (Math.abs(s.vx) < REST_SPEED && Math.abs(s.vy) < REST_SPEED) {
          s.vx = 0; s.vy = 0;
        }
      }

      // Pairwise collisions (32 bodies = ~500 pair checks, trivial).
      for (let i = 0; i < state.length; i++) {
        for (let j = i + 1; j < state.length; j++) {
          const a = state[i], b = state[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const minDist = a.r + b.r;
          if (dist < minDist && dist > 0.001) {
            const overlap = (minDist - dist) / 2;
            const nx = dx / dist, ny = dy / dist;
            a.x -= nx * overlap; a.y -= ny * overlap;
            b.x += nx * overlap; b.y += ny * overlap;
            const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
            const vn = rvx * nx + rvy * ny;
            if (vn < 0) {
              const restitution = 0.35;
              const jimp = -(1 + restitution) * vn / 2;
              a.vx -= jimp * nx; a.vy -= jimp * ny;
              b.vx += jimp * nx; b.vy += jimp * ny;
              a.vr -= (Math.random() - 0.5) * 0.003;
              b.vr += (Math.random() - 0.5) * 0.003;
            }
          }
        }
      }

      for (const s of state) {
        const tx = s.x - sqSize / 2;
        const ty = s.y - sqSize / 2;
        s.p.el.style.transform = `translate(${tx}px, ${ty}px) rotate(${s.rot}rad)`;
        s.p.x = tx; s.p.y = ty; s.p.rot = s.rot;
      }

      const elapsed = now - start;
      if (elapsed < DURATION) requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}

// ---- Walk back: tumbled pieces travel to next-position squares ---------
function walkBack() {
  return new Promise((resolve) => {
    const pos = POSITIONS[posIndex];
    creditEl.textContent = pos.credit;
    const arr = fenToBoardArray(pos.fen);

    const targets = arr.map(p => ({
      sq: p.file + p.rank,
      color: p.char === p.char.toUpperCase() ? 'w' : 'b',
      type: p.char.toLowerCase(),
      char: p.char,
      end: squareToXY(p.file + p.rank),
      assigned: null,
    }));

    const available = livePieces.slice();
    for (const t of targets) {
      let bestIdx = -1, bestDist = Infinity;
      for (let i = 0; i < available.length; i++) {
        const p = available[i];
        if (!p || p.color !== t.color || p.type !== t.type) continue;
        const dx = (p.x + sqSize/2) - (t.end.x + sqSize/2);
        const dy = (p.y + sqSize/2) - (t.end.y + sqSize/2);
        const d = dx*dx + dy*dy;
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      if (bestIdx >= 0) {
        t.assigned = available[bestIdx];
        available[bestIdx] = null;
      }
    }

    // Spawn new pieces for targets with no leftover match.
    const spawnY = sqSize * 8 + sqSize * 0.6;
    for (const t of targets) {
      if (t.assigned) continue;
      const el = createPieceEl(t.char);
      el.style.transform = `translate(${t.end.x}px, ${spawnY}px) rotate(0rad)`;
      piecesLayer.appendChild(el);
      const spawned = {
        el, sq: null, color: t.color, type: t.type, char: t.char,
        x: t.end.x, y: spawnY, rot: 0,
      };
      livePieces.push(spawned);
      t.assigned = spawned;
    }

    const stragglers = livePieces.filter(p => !targets.some(t => t.assigned === p));

    const rowDelay = (rank) => (8 - rank) * 55;
    const fileDelay = (file) => (file.charCodeAt(0) - 97) * 10;
    const WALK_MS = 950;

    for (const t of targets) t.assigned.el.style.transition = 'none';
    for (const p of stragglers) p.el.style.transition = 'none';
    void piecesLayer.offsetHeight;

    for (const t of targets) {
      const p = t.assigned;
      const delay = rowDelay(Number(t.sq[1])) + fileDelay(t.sq[0]);
      p.el.style.transition = `transform ${WALK_MS}ms cubic-bezier(0.34, 1.56, 0.64, 1) ${delay}ms`;
      p.el.style.transform = `translate(${t.end.x}px, ${t.end.y}px) rotate(0rad)`;
      p.x = t.end.x; p.y = t.end.y; p.rot = 0; p.sq = t.sq;
    }
    for (const p of stragglers) {
      p.el.style.transition = `transform ${WALK_MS}ms cubic-bezier(0.4, 0, 0.9, 0.4) 0ms`;
      p.el.style.transform = `translate(${p.x}px, ${spawnY + sqSize * 2}px) rotate(${p.rot + 0.5}rad)`;
    }

    const maxDelay = 8 * 55 + 8 * 10 + WALK_MS + 60;
    setTimeout(() => {
      for (const p of stragglers) p.el.remove();
      livePieces = livePieces.filter(p => !stragglers.includes(p));
      for (const p of livePieces) p.el.style.transition = '';
      resolve();
    }, maxDelay);
  });
}

async function transitionToNext() {
  if (animating) return;
  animating = true;
  skipBtn.disabled = true;

  await tumble();
  await new Promise(r => setTimeout(r, 240));   // beat between tumble-rest + walk-back
  posIndex = (posIndex + 1) % POSITIONS.length;
  await walkBack();

  animating = false;
  skipBtn.disabled = false;
  bumpIdle();
}

buildBoardSquares();
updateSqSize();
renderPosition(0);

let idleTimer = null;
const IDLE_MS = 25_000;
function bumpIdle() {
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (!animating) transitionToNext();
  }, IDLE_MS);
}
document.addEventListener('pointerdown', bumpIdle);
bumpIdle();
</script>
</body>
</html>
