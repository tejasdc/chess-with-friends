<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Chess with friends">
  <!-- Warm paper background — matches --paper #F0E6D2 in the app. iOS
       applies its own rounded-corner mask on the home screen, so we
       leave the SVG full-bleed and edge-safe. -->
  <rect width="512" height="512" fill="#F0E6D2"/>
  <!-- 2×2 mini board, centered, 320×320. Standard chess convention:
       bottom-left square is dark. Two walnut squares (#4A3826) on the
       diagonal, two paper squares matching the ground. -->
  <g>
    <rect x="256" y="96"  width="160" height="160" fill="#4A3826"/>
    <rect x="96"  y="256" width="160" height="160" fill="#4A3826"/>
  </g>
  <!-- One vermillion square — the identity mark. Top-right inset, well
       inside iOS's rounded-mask safe area. Rodchenko's chair as a
       single geometric accent on the paper ground. -->
  <rect x="376" y="60" width="76" height="76" fill="#C43416"/>
</svg>
