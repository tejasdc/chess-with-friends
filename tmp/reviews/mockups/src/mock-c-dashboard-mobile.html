<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="_tokens.css"/>
<style>
html, body { width: 390px; height: 844px; overflow: hidden; }
.shell { position: relative; z-index: 2; height: 100dvh; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(74,56,38,0.16); }
.wordmark { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; text-transform: lowercase; display: flex; align-items: center; gap: 10px; }
.wordmark::before { content: ""; width: 9px; height: 9px; background: var(--vermillion); display: inline-block; }
.menu-dot { font-family: var(--mono); font-size: 22px; color: var(--stone); line-height: 1; padding: 4px 8px; letter-spacing: -0.05em; background: none; border: 0; }

.sec-title { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); margin: 0 0 10px; }

.incoming { background: var(--vermillion); color: var(--paper); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
.incoming strong { font-weight: 600; }
.incoming .accept { font-family: var(--mono); font-size: 12px; padding: 6px 12px; background: var(--paper); color: var(--vermillion); border: 0; font-weight: 600; }

.online-list { display: flex; flex-direction: column; }
.friend-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(74,56,38,0.16); }
.friend-row:last-child { border-bottom: 0; }
.friend-l { display: flex; align-items: center; gap: 10px; }
.presence { width: 9px; height: 9px; border-radius: 50%; background: var(--presence-online); flex-shrink: 0; }
.presence.offline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stone); }
.presence.reconnecting { background: var(--presence-reconnect); }
.h { font-family: var(--mono); font-size: 14px; color: var(--ink); }
.play-cta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); padding: 6px 10px; border: 1px solid var(--ink); background: transparent; }

.play-card { border-top: 1px solid rgba(74,56,38,0.16); border-bottom: 1px solid rgba(74,56,38,0.16); padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
.tc-row { display: flex; gap: 20px; font-family: var(--mono); font-size: 13px; }
.tc { color: var(--stone); padding: 2px 0; border-bottom: 1.5px solid transparent; }
.tc.active { color: var(--ink); border-bottom-color: var(--ink); }
.friend-sel { font-family: var(--mono); font-size: 15px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--walnut); appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%236B6455' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; background-size: 10px 6px; padding-right: 34px; }
.play-btn { font-family: var(--mono); font-size: 13px; padding: 12px 20px; background: var(--ink); color: var(--paper); border: 0; align-self: flex-start; }

.collapsed { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.collapse-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(74,56,38,0.16); font-size: 14px; color: var(--ink); }
.collapse-row:last-child { border-bottom: 0; }
.collapse-row .chev { font-family: var(--mono); font-size: 12px; color: var(--stone); }

.spacer { flex: 1; }
.attrib-hint { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--stone); text-transform: uppercase; text-align: center; padding-top: 8px; }
</style></head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="wordmark">chess with friends</span>
    <button class="menu-dot">···</button>
  </div>

  <!-- Incoming (priority 1: needs response) -->
  <section class="incoming">
    <span><strong>@julia_park</strong> invited you · 10 min</span>
    <button class="accept">Accept</button>
  </section>

  <!-- Online now (priority 2: who you could play RIGHT NOW) -->
  <section>
    <h2 class="sec-title">Friends online now</h2>
    <div class="online-list">
      <div class="friend-row"><div class="friend-l"><span class="presence"></span><span class="h">@marc_iancu</span></div><button class="play-cta">Invite</button></div>
      <div class="friend-row"><div class="friend-l"><span class="presence"></span><span class="h">@saira</span></div><button class="play-cta">Invite</button></div>
    </div>
  </section>

  <!-- Start a game (priority 3: initiate) -->
  <section class="play-card">
    <div class="tc-row">
      <span class="tc active">Now</span>
      <span class="tc">Schedule</span>
    </div>
    <select class="friend-sel"><option>@marc_iancu</option><option>@saira</option><option>@julia_park</option></select>
    <div style="display:flex;gap:20px;font-family:var(--mono);font-size:13px;">
      <span style="border-bottom:1.5px solid var(--ink); padding-bottom:2px;">10 min</span>
      <span style="color:var(--stone); padding-bottom:2px;">5 min</span>
    </div>
    <button class="play-btn">Send challenge</button>
  </section>

  <!-- Collapsed sections (past games, friends mgmt, invite) -->
  <section class="collapsed">
    <div class="collapse-row"><span>Past games · 12</span><span class="chev">↓</span></div>
    <div class="collapse-row"><span>Manage friends · 6</span><span class="chev">↓</span></div>
    <div class="collapse-row"><span>Invite link</span><span class="chev">↓</span></div>
  </section>

  <div class="spacer"></div>
  <div class="attrib-hint">···  menu holds sign out · install · attribution</div>
</div>
</body></html>
