<!doctype html>
<html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="_tokens.css"/>
<style>
html, body { width: 390px; height: 844px; overflow: hidden; }
.shell { position: relative; z-index: 2; height: 100dvh; display: flex; flex-direction: column; }

.strip { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 10px; min-height: 60px; }
.strip.top    { border-bottom: 1px solid rgba(74,56,38,0.16); }
.strip.bottom { border-top: 1px solid rgba(74,56,38,0.16); background: var(--vermillion); color: var(--paper); }
.strip.bottom .presence { background: var(--paper); box-shadow: none; }
.strip.bottom .handle { color: var(--paper); }
.strip.bottom .captured .piece { color: var(--paper); text-shadow: none; }
.strip.bottom .clock { color: var(--paper); }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.presence { width: 10px; height: 10px; border-radius: 50%; background: var(--presence-online); flex-shrink: 0; }
.presence.offline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--stone); }
.handle { font-family: var(--mono); font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.captured { display: flex; gap: 2px; font-size: 15px; line-height: 1; }
.captured .piece { font-size: 15px; }
.clock { font-family: var(--mono); font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; color: var(--ink); }

.board-area { flex: 1; display: grid; place-items: center; padding: 6px 12px; }
.board-wrap { width: 100%; aspect-ratio: 1/1; max-width: 366px; }

.action-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 14px; gap: 12px; border-top: 1px solid rgba(74,56,38,0.16); }
.turn-hint { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; color: var(--stone); text-transform: uppercase; }
.action-side { display: flex; align-items: center; gap: 14px; }
.moves-toggle { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink); background: none; border: 0; padding: 4px 0; text-transform: uppercase; }
.menu-dot { font-family: var(--mono); font-size: 22px; color: var(--ink); line-height: 1; padding: 4px 8px; letter-spacing: -0.05em; background: none; border: 0; }
</style></head>
<body>
<div class="shell">
  <div class="strip top">
    <div class="who">
      <span class="presence"></span>
      <span class="handle">@julia_park</span>
      <span class="captured"><span class="piece pw">♟</span></span>
    </div>
    <time class="clock">08:42</time>
  </div>

  <div class="board-area">
    <div class="board-wrap" id="board"></div>
  </div>

  <div class="strip bottom">
    <div class="who">
      <span class="presence"></span>
      <span class="handle">@tejas</span>
      <span class="captured"><span class="piece pb">♟</span><span class="piece pb">♟</span></span>
    </div>
    <time class="clock">09:12</time>
  </div>

  <div class="action-row">
    <span class="turn-hint">Your move</span>
    <div class="action-side">
      <button class="moves-toggle">Moves · 12</button>
      <button class="menu-dot">···</button>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>mount("#board", MID_FEN, "w", { "e4": "last-from", "e5": "last-to", "b5": "selected", "c6": "legal-capture", "a4": "legal-dot" });</script>
</body></html>
