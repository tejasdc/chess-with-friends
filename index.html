<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7CA898" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS Safari ignores SVG for the home-screen icon and needs a PNG.
         180×180 is the canonical apple-touch-icon size that Retina iPhones
         sharpen to their native pixel density. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <title>two chairs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      One worker serves both chess.tejas.nyc AND twochairs.club, each with
      its own Cloudflare Web Analytics property. Pick the beacon token at
      runtime so each origin reports to its own property. Anything that
      isn't twochairs.club (chess.tejas.nyc, preview URLs, localhost)
      falls back to the tejas.nyc zone token. The beacon script reads
      data-cf-beacon on load, so dynamic injection works.
    -->
    <script>
      (function () {
        var host = location.hostname;
        var token = host === "twochairs.club" || host.endsWith(".twochairs.club")
          ? "440e3220ea784677a8223afb28c0dacc"
          : "dbfc2c7423ea47be9637714344538b35";
        var s = document.createElement("script");
        s.defer = true;
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
