<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7CA898" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- iOS Safari ignores SVG for the home-screen icon and needs a PNG.
         180×180 is the canonical apple-touch-icon size that Retina iPhones
         sharpen to their native pixel density. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <!--
      Document title vs in-app wordmark split (Tejas 2026-08-04): the
      URL twochairs.club already carries the name; the <title> and share
      metadata should describe WHAT this is. So the tab title / hover
      text / share card title says "chess with friends", while the
      in-app wordmark and the home-screen install label (manifest name)
      stay "two chairs".
    -->
    <title>chess with friends</title>
    <meta name="description" content="No infinite pool of opponents. A game happens when two friends sit down." />
    <meta property="og:title" content="chess with friends" />
    <meta property="og:description" content="No infinite pool of opponents. A game happens when two friends sit down." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://twochairs.club/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="chess with friends" />
    <meta name="twitter:description" content="No infinite pool of opponents. A game happens when two friends sit down." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"440e3220ea784677a8223afb28c0dacc"}'></script>
  </body>
</html>
